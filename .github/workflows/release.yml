name: release

# Publish a signed release: one tag in, signed repositories, a trust bootstrap
# and the two macOS products out.
#
#   guard → pack → verify-runtime → verify-dev → sign → publish → trust
#
# The pack / verify stages and the trust stages are the same scripts the daily
# smoke run exercises. What this workflow adds is the tag guard, the signing
# stage and the publication. Its shape was rehearsed end to end in
# nemn9852/qmdmm-signing-lab, from which release/ was moved; the two stages of
# that lab's own that are absent here — a repository signed by a revoked key,
# and a rotated line — exist to measure an incident response rather than to
# publish anything, and belong to that lab's subject rather than this one's.
#
# Two things are deliberately NOT in this file:
#
#   * the root key. A line's subkey signs that line's day-to-day source, and the
#     keyring source — the one a consumer has to trust before it can trust
#     anything else — is built on a trusted machine and committed. A trust root
#     a workflow could replace is not a trust root.
#   * the Alpine line. abuild signs inside the pack stage because it cannot be
#     told not to, so that line's release path is a different design rather than
#     another row here; the lab never exercised it either.
#
# The two macOS lines are a job group of their own rather than rows of the
# stage matrices: a macOS runner cannot run a Linux container, and `runs-on`
# and `container:` are job-level keys, so no row can differ from its neighbours
# in either. They run the same three stages through the same ci/ scripts and
# sign nothing - neither face has a subkey, and the .dmg's only signature is
# the ad-hoc one macdeployqt applies - which is why stage S is absent from
# their group rather than empty. What publication means for them is its own
# question, because neither product is a repository a consumer configures -
# one is a bottle a formula points at, the other a file a person downloads -
# so their publish stage is laid out on its own terms rather than as another
# `cp` into the site.
#
# Why dispatch-only: this signs. A signature says "this artifact is worth
# trusting", and the only honest trigger for that statement is a person
# deciding to make it. It also writes the gh-pages branch, which is the
# published repository.
#
#   gh workflow run release.yml -f qmdmm_ref=0.0.1
on:
  workflow_dispatch:
    inputs:
      qmdmm_ref:
        description: 'QMdmm tag to release (a tag name, not a branch)'
        required: true
        type: string
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Release'
        type: choice
        options: [Release, MinSizeRel, Debug]

permissions:
  contents: write            # publish pushes the gh-pages branch

env:
  # The same inputs the smoke workflow takes, and for the same reason: the
  # stage scripts read these names, so they are set once here rather than at
  # each call site.
  QMDMM_REPO: https://github.com/QMdmm/QMdmm.git
  QMDMM_REF: ${{ github.event.inputs.qmdmm_ref }}
  QMDMM_BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  # The root key does not rotate, so pinning its fingerprint here is fine. Each
  # line's SUBKEY is deliberately not listed: the consumer stages discover it
  # from the key file they just fetched, and the signing stages discover it from
  # the secret they were handed, so rotating a line never means editing this
  # file.
  ROOT_FPR: 76665B6C7F672499DA0D4027E6A72C97B8CE838D
  # Pages serves the gh-pages branch of this repository, so the published layout
  # IS the repository layout a consumer points at.
  PAGES: https://qmdmm.github.io/QMdmmPackagingCi
  # Containers start with LANG unset, which makes Qt switch itself to C.UTF-8
  # and say so on every launch.
  LANG: C.UTF-8
  # ---- the Homebrew face ---------------------------------------------------
  # The tap the formula lives in, in Homebrew's own spelling: the repository is
  # QMdmm/homebrew-qmdmm and `brew tap` drops the prefix, so this is what both
  # `brew tap` and `brew trust` take. The formula is not in this repository on
  # purpose - what gets verified has to be the recipe a user gets.
  HOMEBREW_TAP: QMdmm/qmdmm
  # Where a bottle is said to live while it is being poured, and the reason it
  # is an address no user will ever see: stage A cannot reach the machine that
  # pours, so each consuming stage serves its own copy of the bottle directory
  # on loopback and the pour goes through a real download with a real checksum
  # check. Publishing rewrites this one line to the address the bottle will
  # actually live at, and the trust stage is what proves the rewrite took -
  # by pouring from the tap a user installs from. See release/publish-brew.sh.
  BOTTLE_ROOT_URL: http://127.0.0.1:8000
  # Homebrew updates its own index before an install unless told not to, which
  # on a macOS runner is minutes spent refreshing a snapshot nothing here
  # depends on: the formula under test comes from the tap, and its Qt
  # dependencies resolve from whatever index is on the machine.
  HOMEBREW_NO_AUTO_UPDATE: '1'

defaults:
  run:
    shell: bash

jobs:

  # ==================================================================== guard
  # A release must be traceable to something immutable. A tag is; a branch is
  # not, and "signed main" is a statement about nothing in particular. In a
  # workflow_dispatch run github.ref_type describes the ref the WORKFLOW was
  # dispatched from, so it cannot answer this - hence a script that asks the
  # remote about the input's value instead.
  guard:
    name: "guard (the ref is a tag)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert the requested revision is a tag
        env:
          REVISION: ${{ github.event.inputs.qmdmm_ref }}
        run: bash "$PWD/release/assert-revision-tag.sh"

  # ================================================================= stage A
  # One row per (line, version), in that row's own distribution image. This is
  # the release layout, so the versions are concrete: the daily smoke run checks
  # one floating representative per packaging method, while a published
  # repository has to name the release it serves.
  pack:
    name: "A pack (${{ matrix.line }} ${{ matrix.version }})"
    needs: [guard]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The sfx_* fields are the package-name suffixes the later stages
          # select on; they follow each distribution's own convention.
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie",            expect: "-6 -6-dev -common-dev -doc",   sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky",             expect: "-6 -6-dev -common-dev -doc",   sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid",               expect: "-6 -6-dev -common-dev -doc",   sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute",          expect: "-6 -6-dev -common-dev -doc",   sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking",          expect: "-6 -6-dev -common-dev -doc",   sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44",                expect: "-6 -6-devel -common-devel -doc", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45",                expect: "-6 -6-devel -common-devel -doc", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide",           expect: "-6 -6-devel -common-devel -doc", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10", expect: "-6 -6-devel -common-devel -doc", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10",             expect: "-6 -6-devel -common-devel -doc", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base",           expect: "-6",                             sfx_runtime: "-6", sfx_dev: "-6" }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest", expect: "-6",                             sfx_runtime: "-6", sfx_dev: "-6" }
    steps:
      - uses: actions/checkout@v7
      - name: Pack
        env:
          DIST_EXPECT: ${{ matrix.expect }}
        run: ci/pack-${{ matrix.fmt }}.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: out
          if-no-files-found: error

  # ================================================================= stage B
  # A clean container of the same distribution, holding nothing but the
  # packages: does installing the runtime package alone give a program that
  # runs? `if: always()` so that one line's packaging failure does not silently
  # suppress every other line's verification - a row whose own pack failed
  # fails on its missing artifact instead.
  verify-runtime:
    name: "B runtime (${{ matrix.line }} ${{ matrix.version }})"
    needs: [pack]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie",            sfx_runtime: "-6" }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky",             sfx_runtime: "-6" }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid",               sfx_runtime: "-6" }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute",          sfx_runtime: "-6" }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking",          sfx_runtime: "-6" }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44",                sfx_runtime: "-6" }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45",                sfx_runtime: "-6" }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide",           sfx_runtime: "-6" }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10", sfx_runtime: "-6" }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10",             sfx_runtime: "-6" }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base",           sfx_runtime: "-6" }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest", sfx_runtime: "-6" }
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Install the runtime package
        env:
          DIST_SFX_RUNTIME: ${{ matrix.sfx_runtime }}
        run: ci/runtime-${{ matrix.fmt }}.sh
      - name: Verify the installed programs
        env:
          DIST_KIND: ${{ matrix.fmt }}
        run: ci/runtime-verify-linux.sh

  # ================================================================= stage C
  # Another clean container: is the dev package enough to build QMdmm's own
  # consumer project, and do the executables it produces work?
  verify-dev:
    name: "C dev (${{ matrix.line }} ${{ matrix.version }})"
    needs: [pack]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie",            sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky",             sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid",               sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute",          sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking",          sfx_runtime: "-6", sfx_dev: "-6-dev" }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44",                sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45",                sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide",           sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10", sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10",             sfx_runtime: "-6", sfx_dev: "-6-devel" }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base",           sfx_runtime: "-6", sfx_dev: "-6" }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest", sfx_runtime: "-6", sfx_dev: "-6" }
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Install the dev package
        env:
          DIST_SFX_RUNTIME: ${{ matrix.sfx_runtime }}
          DIST_SFX_DEV: ${{ matrix.sfx_dev }}
        run: ci/dev-${{ matrix.fmt }}.sh
      - name: Build the consumer project
        env:
          DIST_KIND: ${{ matrix.fmt }}
        run: ci/build-verify-linux.sh
      - name: Run the rebuilt Bot against the installed Server
        env:
          DIST_KIND: ${{ matrix.fmt }}
        run: ci/run-verify-linux.sh

  # =========================================== the macOS faces (A / B / C)
  # The two macOS lines, in a job group of their own. Same three questions,
  # same three stages, a second platform: A packs, B proves the runtime alone
  # runs on a machine that has nothing else, C proves the one package is enough
  # to build against. What the group does not have is stage C for the .dmg
  # line - a disk image carries no development content at all, and pack-macos
  # asserts exactly that - and stage S for either, since neither face has a
  # subkey to sign with.
  #
  # B and C do not reuse A's machine, for the same reason the Linux rows do not
  # reuse A's container: with the toolchain still installed, a missing runtime
  # dependency would be masked by it. On this platform the fresh runner is the
  # equivalent of the clean container, with one difference the scripts assert
  # rather than assume - a container starts empty, while a runner image already
  # carries Homebrew, cmake and ninja, and Qt is the package that would make
  # stage B vacuous. It is not in the image, and ci/runtime-brew.sh checks that
  # before it installs anything.

  pack-brew:
    name: "A pack (brew)"
    needs: [guard]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The whole stage in ci/pack-brew.sh: tap the repository that holds the
      # formula, re-derive its source pin for this run's ref, build and bottle
      # through Homebrew's own commands, and collect the bottle plus the
      # formula carrying its checksums. Nothing is signed and nothing is
      # uploaded anywhere: the bottle is an artifact of this run, and the
      # address it will be poured from is written into it by the publish stage.
      - name: Pack
        run: ci/pack-brew.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pack-brew
          path: out
          if-no-files-found: error

  pack-macos:
    name: "A pack (macos)"
    needs: [guard]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The one line in this file the workflow hands Qt to rather than the
      # platform doing it, and not as a preference: a bundle has to be built
      # against an archive whose frameworks can be copied into it, and
      # Homebrew's Qt has QML plugins that are symlinks into the Cellar, which
      # dangle the moment they are copied.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.*'
          modules: 'qtwebsockets'
      # ci/pack-macos.sh: fetch QMdmm at this run's ref, configure against that
      # archive for both architectures, build, pack a universal .dmg, and
      # assert the shape of what came out on the mounted image rather than on
      # the build tree.
      - name: Pack
        run: ci/pack-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pack-macos
          path: out
          if-no-files-found: error

  # `if: always()` for the reason the container rows give: GitHub cannot say
  # "this row depends on that row of that matrix", so a row whose own pack
  # failed fails on its missing artifact instead of being silently skipped -
  # and a silently skipped row would take stage S with it.
  verify-runtime-brew:
    name: "B runtime (brew)"
    needs: [pack-brew]
    if: always() && !cancelled()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-brew
          path: pkgs
      # coreutils, for gtimeout. The container rows have it in the image; here
      # it is a harness dependency the workflow installs, on the same footing
      # as the `Install bash` step the Alpine line needs. Nothing it installs
      # can stand in for the Qt the dependency assertion is about - the "this
      # runner has no Qt" check runs in ci/runtime-brew.sh before the formula
      # is installed.
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils
      # ci/runtime-brew.sh: prove the runner really has no Qt, tap and trust,
      # put stage A's formula into the tap, serve the bottle on loopback, pour
      # it - and insist that it was poured rather than built from source, which
      # is the reading that says the bottle block and the bottle agree. It ends
      # with the recipe's own `test do` block run through `brew test`, and then
      # with the same command against a copy of that block whose program is not
      # installed, so the step's reading is one that can go red.
      - name: Pour the bottle
        run: ci/runtime-brew.sh
      - name: Verify the installed programs
        env:
          MACOS_FACE: brew
        run: ci/runtime-verify-macos.sh

  # Two rows, one per architecture, and this is the only place the image's
  # x86_64 slice can be run at all: a universal image carries both slices but a
  # machine starts one of them, so on an arm64 runner it is the arm64 slice,
  # and the x86_64 slice's first real execution has to happen on Intel
  # hardware. Rosetta would not answer the same question - a translated run
  # says something about Rosetta rather than about what an Intel user gets. The
  # producing job stays single and deliberately: one universal .dmg is built
  # once and both rows verify that same artifact, so what the matrix spreads is
  # the machine, not the build.
  #
  # `macos-26-intel` and not `macos-15-intel`, because the image's lowest
  # supported macOS is whatever `pack-macos` built on - the floor of the Qt
  # inside it, which ci/pack-macos.sh reads rather than assumes - and the
  # bundle declares that floor in the two places a loader and the Finder look.
  # An older runner would produce a dyld error rather than a reading, which is
  # why ci/runtime-macos.sh reports the bundle's own floor as well as the slice
  # it actually started.
  verify-runtime-macos:
    name: "B runtime (macos-${{ matrix.mac.arch }})"
    needs: [pack-macos]
    if: always() && !cancelled()
    runs-on: ${{ matrix.mac.runner }}
    strategy:
      fail-fast: false
      matrix:
        mac:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-macos
          path: pkgs
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils
      # ci/runtime-macos.sh: assert this runner has no Qt, mount the image and
      # copy the application across the way the image's own readme tells a user
      # to. That the copy is what gets run matters here more than on the
      # Homebrew line: the framework lookups are recorded in the bundle's
      # Info.plist and are only exercised by a copy that moved.
      #
      # MACOS_ARCH is the row's premise, handed to the script so it can assert
      # it rather than assume it: a row labelled x86_64 that landed on an arm64
      # machine would start the other slice and be a duplicate of its neighbour
      # wearing a different name.
      - name: Mount the image and copy the application
        env:
          MACOS_ARCH: ${{ matrix.mac.arch }}
        run: ci/runtime-macos.sh
      # The same verification script the Homebrew line runs, with the face
      # switched: the programs come from the bundle, and the dependency
      # assertion points the other way - nothing may resolve out of it.
      - name: Verify the installed programs
        env:
          MACOS_FACE: dmg
        run: ci/runtime-verify-macos.sh

  verify-dev-brew:
    name: "C dev (brew)"
    needs: [pack-brew]
    if: always() && !cancelled()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-brew
          path: pkgs
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils
      # ci/dev-brew.sh: the same pour as stage B on a machine of its own, plus
      # the QMdmm sources the consumer project builds. There is no separate dev
      # package to install - one formula carries the runtime, the headers and
      # the CMake package - so what this stage asks is not "does a second
      # package resolve" but "is the one package enough to build against", the
      # same narrowing the Arch row makes.
      - name: Install the formula
        run: ci/dev-brew.sh
      # Qt's Linguist tools, installed for this stage rather than declared by
      # the formula: the consumer rebuilds QMdmmGui from source and its
      # CMakeLists asks for LinguistTools, while running the three programs
      # does not need them. It goes here and not in the step above because
      # qttools depends on qtbase and qtdeclarative, and stage C opens by
      # asserting that the runner arrived without Qt.
      - name: Install Qt's Linguist tools (for the consumer build)
        run: brew install qttools
      - name: Build the consumer project
        run: ci/build-verify-macos.sh
      - name: Run the rebuilt Bot against the installed Server
        run: ci/run-verify-macos.sh

  # ================================================================= stage S
  # Sign what stage A built, once per row, in the row's own image and with that
  # row's subkey.
  #
  # `needs` on every verify stage is the gate this workflow exists for. A
  # signature asserts that the thing it covers is worth trusting, so appending
  # one to packages nobody has installed yet means the release is interrupted
  # *after* the signature is already public. Waiting for B and C means a broken
  # package is found while nothing has been signed.
  #
  # The macOS stages are in that list too, and that is a decision rather than an
  # accident of naming: publish is one act, so a macOS line that fails after the
  # Linux repositories are signed and public would interrupt the release for a
  # reason the signature cannot express. One platform's failure holds the whole
  # release, which for a release is the wanted behaviour.
  #
  # GitHub cannot express "this row depends on that row of that matrix", so this
  # waits for the stages as a whole: if any row fails, nothing is signed. For a
  # release that is the wanted behaviour rather than a limitation.
  #
  # `environment:` is the only thing that makes a line's SIGNING_KEY visible.
  # The secret holds one sign-only subkey for that line - never the root key -
  # and sign-repo-*.sh asserts as much before it signs anything.
  sign:
    name: "S sign (${{ matrix.line }} ${{ matrix.version }})"
    needs: [verify-runtime, verify-dev, verify-runtime-brew, verify-dev-brew, verify-runtime-macos]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    environment: ${{ matrix.line }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie" }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky" }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid" }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute" }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking" }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44" }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45" }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide" }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10" }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10" }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base" }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest" }
    steps:
      - uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Sign the repository
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          PKGS: ${{ github.workspace }}/pkgs
          OUT: ${{ github.workspace }}/repo
          LINE: ${{ matrix.line }}
          # The apt suite is the row's version name; the rpm and pacman scripts
          # have no use for it.
          SUITE: ${{ matrix.version }}
        run: bash "$PWD/release/sign-repo-${{ matrix.fmt }}.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.line }}-${{ matrix.version }}
          path: repo
          if-no-files-found: error

  # ================================================================= publish
  # Collect what stage S signed and put it on gh-pages, at the path a consumer
  # will point at. The collection walks the artifact names rather than a list of
  # lines: a hard-coded list is what silently drops every artifact the day the
  # naming changes.
  #
  # The Homebrew line comes in here too, and it is the one publication that is
  # not a directory of packages: what a consumer of that line configures is a
  # tap, and what the tap needs from a release is the bottle and the formula
  # that names its address. Both are staged by release/publish-brew.sh, which is
  # also where the argument for the address being this site's lives.
  publish:
    name: "publish"
    needs: [sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Everything, by name rather than by a list of the names this job knows
      # about: the repository artifacts it walks below, and the two macOS
      # products, which are this job's business for the bottle and the next
      # job's for the disk image.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The list goes on the front page of the site and it is hand-maintained,
      # so a line whose subkey was rotated and whose row was not edited would
      # advertise the revoked key as that line's operational one. That happened
      # three times in the lab before anyone looked, so it is checked at the
      # moment it becomes public.
      - name: Check the fingerprint list against the keys it lists
        run: bash "$PWD/release/check-fingerprints.sh"

      # Before the site is assembled, because the index written at the end of
      # that step lists what `_site` holds - and a bottle staged afterwards
      # would be served without appearing anywhere, which is how a published
      # file becomes one nobody can find.
      - name: Publish the bottle into the site
        run: |
          mkdir -p _site
          bash "$PWD/release/publish-brew.sh" artifacts/pack-brew _site

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/                     # built off-CI, staged at its published path
          mkdir -p _site/keys && cp -r keys/. _site/keys/

          shopt -s nullglob
          n=0
          for d in artifacts/repo-*; do
            name="${d#artifacts/repo-}"
            line="${name%%-*}"; ver="${name#*-}"
            # repo-<line>-<version>, and both parts must be present: a name with
            # no dash would otherwise publish itself to a path that hides the bug.
            if [ -z "$line" ] || [ -z "$ver" ] || [ "$line" = "$ver" ]; then
              echo "!! cannot read a line/version out of '$name'"; exit 1
            fi
            rm -rf "_site/$line/$ver"
            mkdir -p "_site/$line/$ver"
            cp -r "$d/." "_site/$line/$ver/"
            echo "  $name -> $line/$ver  ($(find "$d" -type f | wc -l | tr -d ' ') files)"
            n=$((n+1))
          done
          echo "  $n signed repository/repositories staged"
          [ "$n" -ge 1 ] || { echo "!! no stage-S artifact to publish"; exit 1; }

          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>QMdmm packages</title>'
            echo '<h1>QMdmm packages</h1>'
            echo '<p>Signed QMdmm packages. See the project README for how a consumer'
            echo 'installs the repository configuration and the signing keys.</p>'
            echo '<h2>Fingerprints</h2><pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' keys/fingerprints.txt
          echo '</pre><h2>Repository roots</h2><ul>'
          # A line directory holds one row per version; anything else at the top
          # level is material built off-CI (the keyring sources). Derived from
          # release/lines.tsv rather than listed, so that it cannot drift from
          # the list the rest of this workflow uses.
          lines=$(tail -n +2 release/lines.tsv | cut -f1 | sort -u)
          for top in $(cd _site && find . -mindepth 1 -maxdepth 1 -type d | sed 's|^\./||' | sort); do
            if printf '%s\n' "$lines" | grep -qx "$top"; then
              for ver in $(cd "_site/$top" && find . -mindepth 1 -maxdepth 1 -type d | sed 's|^\./||' | sort); do
                echo "<li><a href=\"$top/$ver/\">$top/$ver/</a></li>"
              done
            elif [ "$top" = brew ]; then
              # The Homebrew face, named here rather than added to lines.tsv: that
              # list is what the fingerprint gate and the three stage matrices
              # read, and this face has neither a subkey nor a row. Its contents
              # are listed by file because each one is an address somebody needs -
              # the bottle a formula fetches, and the formula itself - and
              # "(built off-CI)" would be the wrong thing to say about either.
              for f in $(cd "_site/$top" && find . -mindepth 1 -maxdepth 1 -type f | sed 's|^\./||' | sort); do
                echo "<li><a href=\"$top/$f\">$top/$f</a></li>"
              done
            else
              echo "<li><a href=\"$top/\">$top/</a> (built off-CI)</li>"
            fi
          done
          echo '</ul><h2>Tree</h2><pre>'
            (cd _site && find . -type f | sort | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
            echo '</pre>'
          } > _site/index.html
          # The trust stages wait on this: a branch deploy is async, so "the
          # push returned" does not mean "Pages is serving the new content".
          printf '{"sha":"%s","run":"%s","at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > _site/publish.json
          cat _site/publish.json
          echo "--- site contents ---"
          (cd _site && find . -type f | sort)

      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q _pub && cd _pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../_site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git -c user.name="Neve M. Nguyen" -c user.email="nemn9852@agent.qq.com" \
                commit -q -m "publish ${GITHUB_SHA:0:7}"
            git push -q origin gh-pages
            echo "pushed gh-pages"
          fi

      - name: Wait for Pages to actually serve it
        run: |
          set -euo pipefail
          # A branch deploy is asynchronous and the CDN in front of Pages can
          # keep answering with the previous deploy for a while afterwards.
          # Waiting once here is cheaper and more honest than making each trust
          # cell wait on its own: a stubborn CDN then fails one job with a clear
          # message instead of twelve.
          for i in $(seq 1 120); do
            raw=$(curl -fsSL --max-time 15 \
                        -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                        "$PAGES/publish.json?cb=${RANDOM}${RANDOM}" 2>/dev/null || true)
            got=$(printf '%s' "$raw" | tr -d ' \n' | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "Pages is serving ${got:0:7} (after $i poll(s))"
              exit 0
            fi
            echo "Pages still serves ${got:-nothing} - waiting"
            sleep 10
          done
          echo "!! Pages never served ${GITHUB_SHA:0:7}"; exit 1

  # ================================== publish (the macOS disk image)
  # The second macOS product, and the only stage in this workflow that writes
  # outside the repository it runs in. A .dmg is not an input to a recipe the way
  # a bottle is - it is the product itself, and the page a person looks at to
  # download it is the product's own release page. No token a workflow is issued
  # can reach that page, so this one step carries PRODUCT_RELEASE_TOKEN, and it
  # is the only thing in this file that does.
  #
  # It runs after `publish` rather than beside it because the two are one
  # publication: a run whose site failed has released nothing, and an image on a
  # release whose repositories were never published would be the only thing
  # anyone could get from it.
  #
  # What it must never do is overwrite. The release it attaches to is assembled
  # by several runs, so the assets already on it are somebody else's; the script
  # reads the asset names before the upload and again after it and refuses to
  # accept a difference other than the one file it was handed.
  publish-macos:
    name: "publish (the macOS disk image)"
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the disk image
        uses: actions/download-artifact@v8
        with:
          name: pack-macos
          path: pkgs
      # release/publish-macos.sh: the release has to exist before a run is
      # dispatched, the image's version has to be the release's tag, an asset
      # already under this name is never replaced, and what the upload did is
      # read back off the release rather than taken from the upload's exit
      # status. A missing token is a failure rather than a skip, because "ran
      # and published nothing" is the one outcome worth failing for.
      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_RELEASE_TOKEN }}
        run: bash "$PWD/release/publish-macos.sh" pkgs

  # ================================================================= trust
  # The path a real user walks: install the keyring, establish trust in the
  # line's key, then install a package signed by it. Every cell below runs in a
  # clean container and declares no environment, which is a consumer's position
  # rather than a rehearsal of it - and each one asserts that it holds no
  # secret, so a secret becoming visible here fails the run.
  #
  # The two halves are deliberately separate jobs. "The keyring arrives as an
  # installable package" and "a consumer that has it can install from the
  # signed repository" are different claims, and a cell that did both would not
  # say which one broke.
  trust-keyring:
    name: "trust: the keyring bootstrap (${{ matrix.line }} ${{ matrix.version }}, ${{ matrix.kind }})"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One cell per published keyring source, not one per format. The
          # package each source carries bakes `Suites:` / the version into what
          # it writes on the consumer, so a source built for the wrong
          # distribution installs and refreshes perfectly well - against the
          # wrong repository. Only running the cell on the distribution the
          # artefact names can see that, and every published artefact is
          # therefore covered.
          # deb: the archive-keyring package configures both repositories.
          - { kind: install, line: debian, version: trixie,   image: "debian:trixie",            script: "consume-keyring-package.sh" }
          - { kind: install, line: debian, version: forky,    image: "debian:forky",             script: "consume-keyring-package.sh" }
          - { kind: install, line: debian, version: sid,      image: "debian:sid",               script: "consume-keyring-package.sh" }
          - { kind: install, line: ubuntu, version: resolute, image: "ubuntu:resolute",          script: "consume-keyring-package.sh" }
          - { kind: install, line: ubuntu, version: stonking, image: "ubuntu:stonking",          script: "consume-keyring-package.sh" }
          # And the keyring source on its own, before the package exists to
          # install - the half that asserts the signer really is the root key.
          - { kind: source,  line: debian, version: trixie,   image: "debian:trixie",            script: "consume-apt-keyring.sh" }
          - { kind: source,  line: debian, version: forky,    image: "debian:forky",             script: "consume-apt-keyring.sh" }
          - { kind: source,  line: debian, version: sid,      image: "debian:sid",               script: "consume-apt-keyring.sh" }
          - { kind: source,  line: ubuntu, version: resolute, image: "ubuntu:resolute",          script: "consume-apt-keyring.sh" }
          - { kind: source,  line: ubuntu, version: stonking, image: "ubuntu:stonking",          script: "consume-apt-keyring.sh" }
          # rpm: one bootstrap stanza, then the *-release package. One cell per
          # line-and-version, since the package name and the repo file it ships
          # both name a single version. Both dnf generations are covered by the
          # lines themselves - fedora is dnf5, rocky and alma are dnf4 - rather
          # than by a third axis, because dnf5 and dnf4 disagree about what
          # re-roots and where caches land, and a version verified on only one
          # of them is an assumption.
          - { kind: install, line: fedora, version: 44,      image: "fedora:44",                script: "consume-dnf-keyring-package.sh" }
          - { kind: install, line: fedora, version: 45,      image: "fedora:45",                script: "consume-dnf-keyring-package.sh" }
          - { kind: install, line: fedora, version: rawhide, image: "fedora:rawhide",           script: "consume-dnf-keyring-package.sh" }
          - { kind: install, line: rocky,  version: 10,      image: "rockylinux/rockylinux:10", script: "consume-dnf-keyring-package.sh" }
          - { kind: install, line: alma,   version: 10,      image: "almalinux:10",             script: "consume-dnf-keyring-package.sh" }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Check the keyring source
        env:
          EXPECT_SHA: ${{ github.sha }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ matrix.version }}
        run: bash "$PWD/release/${{ matrix.script }}"

  trust-consume:
    name: "trust: consume (${{ matrix.line }} ${{ matrix.version }})"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie",            consumer: apt }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky",             consumer: apt }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid",               consumer: apt }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute",          consumer: apt }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking",          consumer: apt }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44",                consumer: dnf }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45",                consumer: dnf }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide",           consumer: dnf }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10", consumer: dnf }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10",             consumer: dnf }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base",           consumer: pacman }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest", consumer: pacman }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      # The built packages travel to the consumer cell so that it can assert the
      # site serves exactly what stage A produced - `served == built` - rather
      # than only that it serves something.
      - name: Download what was built
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Install from the published repository as a consumer
        env:
          EXPECT_SHA: ${{ github.sha }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ matrix.version }}
          PKGS: ${{ github.workspace }}/pkgs
        run: bash "$PWD/release/consume-${{ matrix.consumer }}.sh"
