name: Packaging smoke

# Container-based packaging verification for QMdmm/QMdmm.
#
# Three stages, run once per distribution:
#
#   A  pack     build QMdmm with a full toolchain inside the distribution's own
#               container and produce packages there. Debian and Fedora go
#               through cpack and Arch through makepkg; Alpine goes through
#               abuild reading packaging/alpine/APKBUILD, and its repository is
#               signed. All four lines are rows of this job's matrix, so what
#               only one line needs - a shell, a secret - is a conditional step
#               or an expression rather than a job of its own. Arch's line
#               produces a single package, which is both the runtime and the dev
#               package, and it is not signed.
#   B  runtime  a *clean* container of the same distribution installs only the
#               runtime package, repairs the dependency set, then proves the
#               programs load and run.
#   C  dev      another clean container installs the dev package, repairs the
#               dependency set, then builds QMdmm's own GUI and Bot from source
#               against the installed package via find_package(QMdmm6).
#
# "Repairs the dependency set" reads differently per line, because the package
# managers differ: apt can leave a half-installed state to repair, dnf, pacman
# and apk cannot. Where there is nothing to repair, the settle-up is a database
# audit instead, and it is what fails if anything is left unsatisfied.
#
# B and C deliberately do NOT reuse A's container. With the toolchain and the Qt
# development packages still installed, a missing runtime dependency would be
# masked by them and "minimal but complete" could not be verified at all.
#
# All four lines share all three stages through one matrix: the same questions,
# put to each distribution in its own vocabulary (apt / dnf / pacman / apk).
# Stages B and C carry each line's own difference as a branch of its own, plus
# the steps only that line needs: Alpine installs bash before anything else can
# run and puts the packager key in the trust store, and Arch's build type has to
# reach the recipe it packages from. Alpine's repository is *signed*, which is
# why this workflow holds a packager key at all - apk, unlike apt and dnf, will
# not install from a repository it cannot verify, and abuild offers no way to
# stop signing.
#
# It runs on a schedule as well as on demand: every day the suite re-verifies
# whatever `main` has become, so a packaging regression is caught within a day
# instead of at the next release. The cron field is a dial, not a promise of a
# clock time - see the note on the schedule below.
#
# The packages are installed from a local repository built out of the artifacts
# rather than by file path: that is the only way the declared inter-component
# dependencies (qmdmm-6-dev -> qmdmm-6 + qmdmm-common-dev) are actually resolved
# instead of being sidestepped.
#
# On Arch the same repository serves a narrower purpose. There are no
# inter-component dependencies to resolve, but installing from it by name still
# proves the package is findable and its declared Qt dependencies resolvable.
#
# The shell lives in `ci/`, one entry script per line per stage, because the same
# logic has a second caller now: the release packaging that produces the versioned
# artifacts reuses stages A, B and C rather than growing a copy of them. Each line
# has its own
#
#   ci/pack-<kind>.sh      (stage A: toolchain, fetch, build, pack, collect)
#   ci/runtime-<kind>.sh   (stage B: inspection tooling, local repository,
#                           install the runtime package, repair or audit)
#   ci/dev-<kind>.sh       (stage C: plain toolchain, local repository, install
#                           the dev package, repair or audit, fetch sources)
#
# and the two steps that are the *same* question on every line are one file per
# platform instead: ci/runtime-verify-linux.sh and the pair ci/build-verify.sh +
# ci/run-verify-linux.sh, which read `DIST_KIND` for the two things that really do
# differ - the timeout's exit status and the loader's wording.
#
# The package list each stage needs is the one thing that stays a decision here,
# and it is passed to `ci/base-image-<kind>.sh`, which refreshes the image and
# installs whatever it is handed. That is why stage B's and C's installs are the
# same two lines of plumbing as stage A's, with different arguments.
#
# What stays in this file is what only a workflow can do: the matrix, the `uses:`
# steps, the `if:` that picks a line's row, and the three `Install bash` steps -
# one per stage, since they run under `sh`, before bash exists on Alpine, which
# is the one thing a `#!/usr/bin/env bash` script cannot do.

on:
  workflow_dispatch:
    inputs:
      qmdmm_ref:
        # This value is handed straight to `git fetch --depth 1 origin '<ref>'`
        # in every job that fetches the source, and fetch resolves a ref name or
        # a full object name and nothing else. An abbreviated SHA is neither, so
        # a short SHA fails at that job's checkout - an error that reads as a
        # checkout problem rather than as the input it is. Branch and tag names
        # are fine; a commit has to be written out in full.
        description: 'QMdmm ref (branch, tag, or full 40-character commit SHA) to package and verify'
        required: true
        default: 'main'
        type: string
      build_type:
        description: 'CMake build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - MinSizeRel
          - Debug
  schedule:
    # GitHub's cron scheduler has no timezone setting and always reads UTC, so
    # the intended hour is written into the field as 00:00 UTC (08:00 UTC+8).
    # Scheduled runs have no inputs at all, which is what the QMDMM_REF /
    # QMDMM_BUILD_TYPE defaults below exist for.
    #
    # The trigger is workflow-wide, so a scheduled run carries every job in this
    # file - the macOS line included. They are rows of this same run, not a
    # workflow of their own, no job has an `if:` keyed to the event, and the
    # event's only effect is to leave those two defaults in force. Adding the
    # macOS line therefore put it on the nightly run as well, deliberately: the
    # nightly run is where a line that breaks without anyone touching it gets
    # noticed, and there is nothing to switch on for it.
    #
    # Runs do not start at the field's hour. Measured over four scheduled runs,
    # all with created_at == run_started_at (started late, not queued):
    #
    #   '0 4 * * *'   09-14 09:41:11Z   +5h41m11s
    #                 09-15 09:16:57Z   +5h16m57s
    #   '0 0 * * *'   09-16 03:20:00Z   +3h20m00s
    #                 09-17 03:25:48Z   +3h25m48s
    #
    # The repository was checked for anything that could explain it (Actions
    # enabled, workflow active, default branch main, public, not a fork). The
    # offset turns out to hang off the cron value: moving the trigger earlier
    # moved the landing time ~2h15m earlier, and two runs on the same value
    # landed 5m48s apart. The field is therefore a dial - if runs keep drifting
    # later, move it an hour earlier to compensate - and not a promise of a
    # clock time. No further field experiments are being run.
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  QMDMM_REPO: https://github.com/QMdmm/QMdmm.git
  # A dispatched run takes these from its inputs; a scheduled run has no
  # inputs at all, so both fall back to `main` - the branch the packaging
  # support was merged into - and Release. The event test is there so the
  # fallback does not depend on how an absent `inputs` object evaluates.
  QMDMM_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qmdmm_ref || 'main' }}
  QMDMM_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'Release' }}
  # Containers start with LANG unset, so Qt switches itself to C.UTF-8 and says
  # so on every launch. Setting it here keeps that noise out of the probe logs.
  LANG: C.UTF-8
  # The basename shared by the Alpine packager's two halves: the public key
  # committed at packaging/alpine/<name>.rsa.pub, and the private key kept in the
  # PACKAGER_PRIVKEY secret. abuild derives each signature's file name from the
  # private key's own name and apk resolves that name in /etc/apk/keys, so the two
  # file names have to agree for a package to be installable at all.
  PACKAGER_KEY: neve-6aaaace6
  # ---- the Homebrew face ---------------------------------------------------
  # The tap the formula lives in, in Homebrew's own spelling: the repository is
  # QMdmm/homebrew-qmdmm and `brew tap` drops the prefix, so this is what both
  # `brew tap` and `brew trust` take, and what the tap's directory is named
  # after. The formula is not in this repository on purpose - what gets
  # verified has to be the recipe a user gets.
  HOMEBREW_TAP: QMdmm/qmdmm
  # Where a bottle is said to live while it is being poured. It is a convention
  # between stage A and the stages that consume its bottle, and not a published
  # address: stage A cannot reach the machine that will pour, so each consuming
  # stage serves its own copy of the bottle directory on loopback and the pour
  # below goes through a real download with a real checksum check. Publishing a
  # bottle is the release step's business, not this workflow's.
  BOTTLE_ROOT_URL: http://127.0.0.1:8000
  # Homebrew updates its own index before an install unless told not to, which on
  # a macOS runner is minutes spent refreshing a snapshot that the pin below does
  # not depend on: the formula under test comes from the tap, and its Qt
  # dependencies resolve from whatever index is on the machine. The Linux lines
  # refresh their images for the opposite reason - there the base image *is* the
  # thing being measured against.
  HOMEBREW_NO_AUTO_UPDATE: '1'

defaults:
  run:
    shell: bash

jobs:

  # ================================================================= stage A
  pack:
    name: "A pack (${{ matrix.dist.name }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # Debian, "-devel" on Fedora, "-dev" again on Alpine - and there the
          # runtime package carries no Qt generation at all, so its "suffix" is
          # the whole name and only `qmdmm` matches it. Arch splits nothing: one
          # package carries the runtime, the headers and the CMake package, so
          # the same suffix answers both questions.
          #
          # `expect` is what stage A asserts the produced package names end in.
          # Where a line's shape is a decision rather than a convention it is
          # written down here instead of being left implied: Arch expects one
          # package and no doc component, because doxygen is deliberately not one
          # of its recipe's make dependencies.
          #
          # Alpine is the one row without an `expect`, because a suffix match
          # cannot say what its names have to be: the runtime package there is
          # plain `qmdmm`, a prefix of every other name, so that line's script
          # keeps the assertion on its own three exact names. It is also the one
          # row `QMDMM_BUILD_TYPE` does not reach - the recipe pins
          # CMAKE_BUILD_TYPE=Release itself - while stage C's consumer build
          # reads the input as it does on every line.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
          - name: alpine
            image: 'alpine:latest'
            kind: apk
            sfx_runtime: 'qmdmm'
            sfx_dev: '-dev'
    steps:
      # The Alpine image ships busybox ash alone, and this file declares bash as
      # its shell, so bash has to arrive before anything else can run - and this
      # one step has to ask for `sh`, which does exist there. Every other line
      # starts with bash already installed.
      - name: Install bash
        if: matrix.dist.kind == 'apk'
        shell: sh
        run: apk add --no-cache bash

      # Unconditional on all four lines, and before the stage script rather than
      # in the middle of it: the Arch line's recipe and the Alpine line's
      # packager key are files in this repository, and the cpack lines read
      # nothing from it. A step list that differs per row is what the per-kind
      # scripts exist to remove; a checkout nobody reads costs seconds.
      - name: Checkout this harness
        uses: actions/checkout@v7

      # The whole stage, in ci/pack-<kind>.sh: refresh the base image and install
      # the toolchain and Qt 6, fetch QMdmm at the requested ref, configure,
      # build, pack and collect. Two things a script cannot know by itself are
      # passed in: `expect` is what the cpack lines assert the produced package
      # names end in, and the private half of the packager key is what abuild
      # signs with - narrowed to the Alpine row, so no other line is handed a
      # secret it has no use for.
      - name: Pack
        env:
          DIST_EXPECT: ${{ matrix.dist.expect }}
          PRIVKEY: ${{ matrix.dist.kind == 'apk' && secrets.PACKAGER_PRIVKEY || '' }}
        run: ci/pack-${{ matrix.dist.kind }}.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.dist.name }}
          path: out
          if-no-files-found: error

  # ================================================================= stage B
  verify-runtime:
    name: "B runtime (${{ matrix.dist.name }})"
    # One pack job now, whose matrix carries every line. GitHub still cannot
    # express "this row depends on that row of that matrix", so the job is
    # allowed to run regardless and a row whose own pack row failed fails on its
    # missing artifact instead - which keeps one line's packaging failure from
    # silently suppressing the other lines' stages.
    needs: pack
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # Same four rows as stage A. The sfx_* fields are what the stage's
          # script selects the runtime package out of MANIFEST.tsv with - they
          # differ per distribution because the naming conventions do.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
          - name: alpine
            image: 'alpine:latest'
            kind: apk
            # No `expect`: this line's stage A row asserts its own three exact
            # names instead. No dev-common either: abuild's split_dev puts the
            # headers and the CMake package config into -dev itself, so there is
            # no third package.
            sfx_runtime: 'qmdmm'
            sfx_dev: '-dev'
    steps:
      - name: Install bash
        # The alpine image ships busybox ash and this file declares bash as its
        # shell, so bash has to arrive first - and this one step has to ask for
        # sh. The other lines start with bash already installed.
        if: matrix.dist.kind == 'apk'
        shell: sh
        run: apk add --no-cache bash

      # On all four lines now, not only on alpine: the checkout used to be
      # conditional because only the apk line read the packager key out of it,
      # but an artifact is transferred below and a stage script should not have
      # to be split around a `uses:` step.
      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      # ci/runtime-<kind>.sh: the inspection tooling (binutils and the package
      # tooling, through ci/base-image-<kind>.sh), the local repository, then the
      # runtime package installed by name and the dependency set repaired.
      - name: Install the runtime package
        env:
          DIST_SFX_RUNTIME: ${{ matrix.dist.sfx_runtime }}
        run: ci/runtime-${{ matrix.dist.kind }}.sh

      # The same verification question on every line, so it is one script rather
      # than four: ci/runtime-verify-linux.sh.
      - name: Verify the installed programs
        env:
          DIST_KIND: ${{ matrix.dist.kind }}
        run: ci/runtime-verify-linux.sh

  # ================================================================= stage C
  verify-dev:
    name: "C dev (${{ matrix.dist.name }})"
    needs: pack
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # Same four rows as stages A and B, same sfx_* fields: stage C selects
          # the dev package with sfx_dev, and the alpine row needs sfx_runtime as
          # well, to assert that the dev package dragged the runtime in.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
          - name: alpine
            image: 'alpine:latest'
            kind: apk
            # No `expect`: this line's stage A row asserts its own three exact
            # names instead. No dev-common either: abuild's split_dev puts the
            # headers and the CMake package config into -dev itself, so there is
            # no third package.
            sfx_runtime: 'qmdmm'
            sfx_dev: '-dev'
    steps:
      - name: Install bash
        # The alpine image ships busybox ash and this file declares bash as its
        # shell, so bash has to arrive first - and this one step has to ask for
        # sh. The other lines start with bash already installed.
        if: matrix.dist.kind == 'apk'
        shell: sh
        run: apk add --no-cache bash

      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      # ci/dev-<kind>.sh: a plain build toolchain (through
      # ci/base-image-<kind>.sh), the local repository, the dev package installed
      # by name, the dependency set repaired, what that dragged in reported, and
      # the QMdmm sources fetched for the consumer project below.
      - name: Install the dev package
        env:
          DIST_SFX_RUNTIME: ${{ matrix.dist.sfx_runtime }}
          DIST_SFX_DEV: ${{ matrix.dist.sfx_dev }}
        run: ci/dev-${{ matrix.dist.kind }}.sh

      # The consumer project built against the installed package, and the
      # executables it produces proven: ci/build-verify-linux.sh. It carries its own
      # summary, written on the way out rather than on the way through - the step
      # that used to write it did so under `if: always()`, which is what a shell
      # script expresses as a trap.
      - name: Build the consumer project
        env:
          DIST_KIND: ${{ matrix.dist.kind }}
        run: ci/build-verify-linux.sh

      # The rebuilt Bot against the installed Server, which is the half that
      # needs port 6366: ci/run-verify-linux.sh.
      - name: Run the rebuilt Bot against the installed Server
        env:
          DIST_KIND: ${{ matrix.dist.kind }}
        run: ci/run-verify-linux.sh

  # ================================================== the Homebrew face
  #
  # Same three questions, same three stages, a second platform - and a job group
  # of its own rather than rows of the three above, because a macOS runner cannot
  # run a Linux container. `runs-on` and `container:` are job-level keys, so a row
  # cannot differ from its neighbours in either, and there is no arranging this
  # as one matrix.
  #
  # What is *not* different is the shape: one row per packaging method, one job
  # per stage, the shell in ci/, and the three stages deliberately not sharing a
  # machine. On macOS a fresh runner is the equivalent of a clean container - with
  # one difference the scripts assert rather than assume: a container starts
  # empty, while a runner image already carries Homebrew, cmake and ninja. Qt is
  # the package that would make stage B vacuous and it is not in the image.
  #
  # One row here, for the same reason each container line has one: a daily run
  # checks the current version of each packaging method, and for macOS that is
  # whatever `macos-latest` is. The other two arm64 macOS versions the support
  # matrix names - sequoia, and golden_gate behind the xcode-27 preview tag -
  # would be rows of this same group, each on its own runner, because the
  # producing runner is the bottle's compatibility floor and a bottle cannot be
  # produced for an older macOS than the runner's. They are simply not in this
  # pass.
  pack-brew:
    name: "A pack (${{ matrix.dist.name }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dist:
          # The `expect` and `sfx_*` fields the container rows carry are absent
          # here, and that is not an omission: they exist to select among four
          # component packages, and this line produces one. Its identity is the
          # formula name, which the stages read out of MANIFEST.tsv rather than
          # being handed.
          - name: brew
            kind: brew
    steps:
      # No `Install bash` step, unlike the container stages: this platform ships
      # one. No `container:` either, and that is the point of the group.
      - name: Checkout this harness
        uses: actions/checkout@v7

      # The whole stage, in ci/pack-brew.sh: tap the repository that holds the
      # formula, re-derive its source pin for this run's ref, build and bottle
      # through Homebrew's own commands, write the bottle block back into the
      # tap's copy of the formula, and collect the bottle plus that formula. The
      # build type input does not reach this line: the formula pins Release
      # itself, exactly as the Alpine line's recipe does.
      - name: Pack
        run: ci/pack-${{ matrix.dist.kind }}.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.dist.name }}
          path: out
          if-no-files-found: error

  # ---- the second macOS line: the self-contained disk image -----------------
  #
  # The same stage and the same three questions, put to a different install
  # shape: the line above bottles a formula whose Qt the machine provides, and
  # this one packs a QMdmm6.app that carries its own Qt inside it. What the two
  # share is everything the harness decides - how the ref is fetched, how the
  # shell is laid out, how the artifact travels - and nothing about the product.
  #
  # It is the one line in this file that the workflow hands Qt to rather than
  # the platform doing it. That is not a preference: a bundle has to be built
  # against an archive whose frameworks can be copied into it, and Homebrew's Qt
  # has QML plugins that are symlinks into the Cellar, which dangle the moment
  # they are copied.
  pack-macos:
    name: "A pack (macos)"
    runs-on: macos-latest
    steps:
      - name: Checkout this harness
        uses: actions/checkout@v7

      # Pinned to an exact patch rather than a `6.11.*` range, and the reason is
      # measured rather than cautious: aqtinstall's default hash algorithm is
      # sha256, Qt publishes a package's `.sha256` only some time after the
      # release lands, and a run that floated onto a fresh patch died with
      # `ChecksumDownloadFailure` before downloading anything at all. 6.11.2 is
      # the newest patch that carries all three checksums.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtwebsockets'

      # The whole stage, in ci/pack-macos.sh: fetch QMdmm at this run's ref,
      # configure against that archive for both architectures, build, pack a
      # .dmg, and assert the shape of what came out - including that the image
      # holds no development content, which is what stands in for this line's
      # missing stage C.
      - name: Pack
        run: ci/pack-macos.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: out
          if-no-files-found: error

  verify-runtime-brew:
    name: "B runtime (${{ matrix.dist.name }})"
    # An exact dependency, which the container stages cannot express: there, one
    # matrix carries every line and GitHub has no way to say "this row depends on
    # that row", so those jobs are allowed to run and a row fails on its missing
    # artifact instead. Here the producing job *is* a job.
    needs: pack-brew
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dist:
          - name: brew
            kind: brew
    steps:
      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      # coreutils, for gtimeout. The Linux lines have coreutils in the image;
      # here it is a harness dependency the workflow installs, on the same footing
      # as the `Install bash` step the Alpine line needs. It is not part of the
      # package under test, and nothing it installs can stand in for the Qt the
      # dependency assertion is about - the "this runner has no Qt" check runs in
      # ci/runtime-brew.sh, before the formula is installed.
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      # ci/runtime-brew.sh: prove the runner really has no Qt, tap and trust,
      # put stage A's formula into the tap, serve the bottle on loopback, pour it
      # - and insist that it was poured rather than built from source, which is
      # the reading that says the bottle block and the bottle agree.
      - name: Pour the bottle
        run: ci/runtime-${{ matrix.dist.kind }}.sh

      # The platform question, which is one script per platform rather than per
      # distribution: ci/runtime-verify-macos.sh. MACOS_FACE picks the face, and
      # there is one of those today - the self-contained .dmg line will add
      # another, with the dependency assertion pointing the other way.
      - name: Verify the installed programs
        env:
          MACOS_FACE: brew
        run: ci/runtime-verify-macos.sh

  verify-runtime-macos:
    name: "B runtime (macos)"
    needs: pack-macos
    runs-on: macos-latest
    steps:
      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-macos
          path: pkgs

      # The same coreutils the Homebrew line's B job installs, for the same
      # reason: gtimeout is what the shared verification script times the
      # programs with, and it is a harness dependency rather than anything the
      # package under test brings.
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      # ci/runtime-macos.sh: assert this runner has no Qt, then mount the image
      # and copy the application across the way the image's own readme tells a
      # user to. That the copy is what gets run matters here more than it does
      # on the Homebrew line - the framework lookups are recorded in the
      # bundle's Info.plist and are only exercised by a copy that moved.
      - name: Mount the image and copy the application
        run: ci/runtime-macos.sh

      # The verification script the Homebrew line runs, with the face switched:
      # the programs come from the bundle, and the dependency assertion points
      # the other way - nothing may resolve *out* of it. There is no stage C on
      # this line, and that is not a gap: the image carries no development
      # content, and ci/pack-macos.sh asserts exactly that.
      - name: Verify the installed programs
        env:
          MACOS_FACE: dmg
        run: ci/runtime-verify-macos.sh

  verify-dev-brew:
    name: "C dev (${{ matrix.dist.name }})"
    needs: pack-brew
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        dist:
          - name: brew
            kind: brew
    steps:
      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      # The same coreutils the B job installs, and ci/build-verify-macos.sh checks
      # for gtimeout up front so a missing harness dependency reads as itself.
      - name: Install coreutils (for gtimeout)
        run: brew install coreutils

      # ci/dev-brew.sh: the same pour as stage B, on a machine of its own, plus
      # the QMdmm sources the consumer project builds. There is no separate dev
      # package to install: one formula carries the runtime, the headers and the
      # CMake package, so what this stage asks is not "does a second package
      # resolve" but "is the one package enough to build against" - the same
      # narrowing Arch's line makes.
      - name: Install the formula
        run: ci/dev-${{ matrix.dist.kind }}.sh

      # Qt's Linguist tools, installed for this stage rather than declared by
      # the formula. The consumer rebuilds QMdmmGui from source, and its
      # CMakeLists asks Qt for LinguistTools, so the tools have to be on the
      # machine; the formula keeps `qttools` build-only, because running the
      # three programs does not need them. It goes here and not in the coreutils
      # step above, because qttools depends on qtbase and qtdeclarative and
      # stage C opens by asserting that the runner arrived without Qt.
      - name: Install Qt's Linguist tools (for the consumer build)
        run: brew install qttools

      # The consumer project built against what the formula installed, and the
      # executables it produces proven: ci/build-verify-macos.sh. It carries its
      # own summary, written on the way out under a trap rather than by a step
      # with `if: always()`, which is what a shell script expresses that as.
      - name: Build the consumer project
        run: ci/build-verify-macos.sh

      # The rebuilt Bot against the installed Server, which is the half that
      # needs port 6366: ci/run-verify-macos.sh.
      - name: Run the rebuilt Bot against the installed Server
        run: ci/run-verify-macos.sh
