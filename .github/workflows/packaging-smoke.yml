name: Packaging smoke

# Container-based packaging verification for QMdmm/QMdmm.
#
# Three stages, run once per distribution:
#
#   A  pack     build QMdmm with a full toolchain inside the distribution's own
#               container and produce packages there. Debian and Fedora go
#               through cpack and Arch through makepkg, all three inside this
#               job's matrix; Alpine's pack stage is a job of its own, because
#               packaging there is abuild reading packaging/alpine/APKBUILD and
#               its repository is signed. Arch's line produces a single package,
#               which is both the runtime and the dev package, and it is not
#               signed.
#   B  runtime  a *clean* container of the same distribution installs only the
#               runtime package, repairs the dependency set, then proves the
#               programs load and run.
#   C  dev      another clean container installs the dev package, repairs the
#               dependency set, then builds QMdmm's own GUI and Bot from source
#               against the installed package via find_package(QMdmm6).
#
# "Repairs the dependency set" reads differently per line, because the package
# managers differ: apt can leave a half-installed state to repair, dnf, pacman and
# apk cannot. Where there is nothing to repair, the settle-up is a database audit
# instead, and it is what fails if anything is left unsatisfied.
#
# B and C deliberately do NOT reuse A's container. With the toolchain and the Qt
# development packages still installed, a missing runtime dependency would be
# masked by them and "minimal but complete" could not be verified at all.
#
# All four lines share stages B and C through one matrix: the same questions, put
# to each distribution in its own vocabulary (apt / dnf / pacman / apk). Stages B
# and C carry each line's own difference as a branch of its own, plus the steps
# only that line needs: Alpine installs bash before anything else can run and puts
# the packager key in the trust store, and Arch's build type has to reach the
# recipe it packages from. Alpine's repository is *signed*, which is why it has a
# pack job to itself - apk, unlike apt and dnf, will not install from a repository
# it cannot verify, and abuild offers no way to stop signing.
#
# It runs on a schedule as well as on demand: every day the suite re-verifies
# whatever `main` has become, so a packaging regression is caught within a day
# instead of at the next release. The cron field is a dial, not a promise of a
# clock time - see the note on the schedule below.
#
# The packages are installed from a local repository built out of the artifacts
# rather than by file path: that is the only way the declared inter-component
# dependencies (qmdmm-6-dev -> qmdmm-6 + qmdmm-common-dev) are actually resolved
# instead of being sidestepped.
#
# On Arch the same repository serves a narrower purpose. There are no
# inter-component dependencies to resolve, but installing from it by name still
# proves the package is findable and its declared Qt dependencies resolvable.

on:
  workflow_dispatch:
    inputs:
      qmdmm_ref:
        description: 'QMdmm ref (branch, tag or commit) to package and verify'
        required: true
        default: 'main'
        type: string
      build_type:
        description: 'CMake build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - MinSizeRel
          - Debug
  schedule:
    # GitHub's cron scheduler has no timezone setting and always reads UTC, so
    # the intended hour is written into the field as 00:00 UTC (08:00 UTC+8).
    # Scheduled runs have no inputs at all, which is what the QMDMM_REF /
    # QMDMM_BUILD_TYPE defaults below exist for.
    #
    # Runs do not start at the field's hour. Measured over four scheduled runs,
    # all with created_at == run_started_at (started late, not queued):
    #
    #   '0 4 * * *'   09-14 09:41:11Z   +5h41m11s
    #                 09-15 09:16:57Z   +5h16m57s
    #   '0 0 * * *'   09-16 03:20:00Z   +3h20m00s
    #                 09-17 03:25:48Z   +3h25m48s
    #
    # The repository was checked for anything that could explain it (Actions
    # enabled, workflow active, default branch main, public, not a fork). The
    # offset turns out to hang off the cron value: moving the trigger earlier
    # moved the landing time ~2h15m earlier, and two runs on the same value
    # landed 5m48s apart. The field is therefore a dial - if runs keep drifting
    # later, move it an hour earlier to compensate - and not a promise of a
    # clock time. No further field experiments are being run.
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  QMDMM_REPO: https://github.com/QMdmm/QMdmm.git
  # A dispatched run takes these from its inputs; a scheduled run has no
  # inputs at all, so both fall back to `main` - the branch the packaging
  # support was merged into - and Release. The event test is there so the
  # fallback does not depend on how an absent `inputs` object evaluates.
  QMDMM_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.qmdmm_ref || 'main' }}
  QMDMM_BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'Release' }}
  # Containers start with LANG unset, so Qt switches itself to C.UTF-8 and says
  # so on every launch. Setting it here keeps that noise out of the probe logs.
  LANG: C.UTF-8
  # The basename shared by the Alpine packager's two halves: the public key
  # committed at packaging/alpine/<name>.rsa.pub, and the private key kept in the
  # PACKAGER_PRIVKEY secret. abuild derives each signature's file name from the
  # private key's own name and apk resolves that name in /etc/apk/keys, so the two
  # file names have to agree for a package to be installable at all.
  PACKAGER_KEY: neve-6aaaace6

defaults:
  run:
    shell: bash

jobs:

  # ================================================================= stage A
  pack:
    name: "A pack (${{ matrix.dist.name }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # Debian, "-devel" on Fedora, "-dev" again on Alpine - and there the
          # runtime package carries no Qt generation at all, so its "suffix" is
          # the whole name and only `qmdmm` matches it. Arch splits nothing: one
          # package carries the runtime, the headers and the CMake package, so
          # the same suffix answers both questions.
          #
          # `expect` is what stage A asserts the produced package names end in.
          # Where a line's shape is a decision rather than a convention it is
          # written down here instead of being left implied: Arch expects one
          # package and no doc component, because doxygen is deliberately not one
          # of its recipe's make dependencies.
          #
          # Alpine is not a row in this job's matrix: its pack stage is the
          # separate `pack-alpine` job below, which asserts its own three exact
          # names.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
    steps:
      - name: Bring the base image up to date
        run: |
          set -euxo pipefail
          # A container image is a snapshot, and a stale one muddies the question
          # this job asks: how much of what lands on the system can be attributed
          # to the package under test and its declared dependencies. Refreshing
          # the base first means everything installed afterwards is measured
          # against a current archive rather than against whatever the image
          # happened to be built from.
          #
          # apt-get dist-upgrade rather than upgrade: the transaction has to stay
          # free to add and remove packages, which is what a distribution expects
          # of a system it is about to install new software onto.
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf -y --setopt=install_weak_deps=False upgrade
          else
            # Arch has one rolling repository set, so -Syu is the whole "bring it
            # up to date" story - there is no sid/stable split to choose between.
            # The keyring goes first because an image that has aged cannot verify
            # today's packages, and the mirrorlist is pinned to the canonical geo
            # mirror so the job does not depend on which entries the image
            # happens to ship enabled.
            echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
              > /etc/pacman.d/mirrorlist
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Syu --noconfirm
          fi

      - name: Install toolchain, Qt 6 and the packagers
        run: |
          set -euxo pipefail
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git ca-certificates build-essential cmake ninja-build pkg-config \
              qt6-base-dev qt6-websockets-dev qt6-declarative-dev \
              qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools \
              qt6-l10n-tools doxygen graphviz
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf install -y --setopt=install_weak_deps=False \
              git ca-certificates gcc-c++ make cmake ninja-build rpm-build rpm \
              qt6-qtbase-devel qt6-qtwebsockets-devel qt6-qtdeclarative-devel \
              qt6-qttools-devel doxygen graphviz
          else
            # base-devel is what makepkg expects underneath it (gcc, make,
            # pkgconf, fakeroot). Arch keeps a Qt module's development files in
            # the same package as its runtime, so there are no -dev names to ask
            # for. pacman-contrib brings updpkgsums, which is how the recipe's
            # checksums follow the tarball this run produces. No doxygen: the Arch
            # recipe ships no doc component, deliberately. The recipe's own make
            # dependencies are named here rather than left to makepkg: makepkg
            # runs as a plain user below and must not have to install anything.
            pacman -S --noconfirm --needed \
              base-devel git ca-certificates cmake ninja \
              qt6-base qt6-declarative qt6-websockets qt6-tools pacman-contrib
          fi

      # Only the Arch line needs this repository checked out: its package
      # description is the recipe in it. Debian and Fedora describe their
      # packages with cpack options from the QMdmm tree itself.
      - name: Checkout this harness
        if: matrix.dist.kind == 'pac'
        uses: actions/checkout@v7

      - name: Fetch QMdmm at the requested ref
        run: |
          set -euxo pipefail
          git init qmdmm-src
          git -C qmdmm-src remote add origin "$QMDMM_REPO"
          git -C qmdmm-src fetch --depth 1 origin '${{ env.QMDMM_REF }}'
          git -C qmdmm-src checkout --detach FETCH_HEAD
          echo "QMdmm HEAD: $(git -C qmdmm-src log --oneline -1)"

      # Arch configures, builds, packs and inspects in one pass inside makepkg, so
      # the three steps that follow are skipped there rather than duplicated: the
      # recipe in packaging/arch is the Arch line's build description.
      - name: Build the package with makepkg
        if: matrix.dist.kind == 'pac'
        run: |
          set -euxo pipefail
          pkgver=$(sed -n 's/^pkgver=\(.*\)$/\1/p' packaging/arch/PKGBUILD)
          mkdir -p arch-build
          cp packaging/arch/PKGBUILD packaging/arch/.SRCINFO arch-build/
          # The recipe takes a local tarball rather than a codeload download; its
          # NOTES say how it was produced. The prefix is what makes the recipe's
          # own `cd "$pkgname-$pkgver"` find the extracted tree. The output path is
          # absolute on purpose: -C makes it relative to qmdmm-src, not to the
          # workspace the build directory lives in.
          git -C qmdmm-src archive --format=tar.gz \
            --prefix="qmdmm-6-${pkgver}/" HEAD \
            -o "$PWD/arch-build/qmdmm-6-${pkgver}.tar.gz"
          # The committed checksums pin the tarball of the one locally verified
          # build. A run packages whatever ref it was handed, so they have to
          # follow the tarball that was actually produced.
          #
          # The recipe pins Release, as a distribution package should; the build
          # type is a dial on dispatched runs, and the other lines hand it
          # straight to CMake. It is applied to this copy rather than left to
          # diverge, and the assertion is there so a recipe that stops pinning it
          # fails loudly instead of quietly building something nobody asked for.
          grep -q -- '-DCMAKE_BUILD_TYPE=Release' arch-build/PKGBUILD \
            || { echo "::error::the recipe no longer pins CMAKE_BUILD_TYPE=Release"; exit 1; }
          sed -i "s/-DCMAKE_BUILD_TYPE=Release/-DCMAKE_BUILD_TYPE=${{ env.QMDMM_BUILD_TYPE }}/" \
            arch-build/PKGBUILD
          # makepkg refuses to run as root, and every step of a container job runs
          # as root, so both the checksum refresh and the build happen as an
          # ordinary user - updpkgsums is a wrapper around makepkg and is not
          # assumed to be any more forgiving. Stages B and C go back to root:
          # installing is not building.
          useradd -m -s /bin/bash builder
          chown -R builder:builder arch-build
          su builder -c "cd '$PWD/arch-build' && updpkgsums"
          su builder -c "cd '$PWD/arch-build' && makepkg -f --noconfirm"
          ls -l arch-build/*.pkg.tar.zst

      - name: Configure
        if: matrix.dist.kind != 'pac'
        run: |
          set -euxo pipefail
          # /usr is where a distribution package installs: it decides both the
          # on-disk layout and the baked-in QMDMM_CONFIGURATION_PREFIX.
          cmake -S qmdmm-src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE='${{ env.QMDMM_BUILD_TYPE }}' \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=OFF \
            -DQMDMM_EXPORT_PRIVATE=NO

      - name: Build
        if: matrix.dist.kind != 'pac'
        run: cmake --build build --parallel

      - name: Pack
        if: matrix.dist.kind != 'pac'
        run: |
          set -euxo pipefail
          cd build
          # Only the native generators: the archive generators the project also
          # configures (7Z/TGZ/TXZ/TZST/ZIP) are not what this workflow verifies.
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            cpack -G DEB
          else
            cpack -G RPM
          fi

      - name: Collect packages and record their real names
        run: |
          set -euxo pipefail
          kind='${{ matrix.dist.kind }}'
          mkdir -p out
          if [ "$kind" = pac ]; then
            cp -v arch-build/*.pkg.tar.zst out/
            ext='pkg.tar.zst'
          else
            cp -v build/*."$kind" out/
            ext="$kind"
          fi

          # Names are read back out of the packages instead of being assumed:
          # the component suffixes are what stages B and C select on.
          printf 'package\tversion\tfile\n' > out/MANIFEST.tsv
          for f in out/*."$ext"; do
            if [ "$kind" = deb ]; then
              p=$(dpkg-deb -f "$f" Package)
              v=$(dpkg-deb -f "$f" Version)
            elif [ "$kind" = rpm ]; then
              p=$(rpm -qp --qf '%{NAME}' "$f")
              v=$(rpm -qp --qf '%{VERSION}' "$f")
            else
              # pacman reads the metadata straight out of the package file, the
              # same way dpkg-deb and rpm do.
              info=$(pacman -Qip "$f")
              p=$(sed -n 's/^Name *: *//p' <<<"$info")
              v=$(sed -n 's/^Version *: *//p' <<<"$info")
            fi
            printf '%s\t%s\t%s\n' "$p" "$v" "$(basename "$f")" >> out/MANIFEST.tsv
          done

          if [ "$kind" = pac ]; then
            how='makepkg'
          else
            how="cpack -G $kind"
          fi
          {
            echo "### Packages produced by \`$how\`"
            echo
            echo '```'
            cat out/MANIFEST.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          missing=''
          for suffix in ${{ matrix.dist.expect }}; do
            awk -F'\t' -v s="$suffix" '$1 ~ s"$" { found = 1 } END { exit !found }' \
              out/MANIFEST.tsv || missing="$missing $suffix"
          done
          if [ "$kind" = pac ]; then
            produced=$(awk 'END { print NR - 1 }' out/MANIFEST.tsv)
            if [ "$produced" -ne 1 ]; then
              echo "::error::the Arch line produces one package by decision, but $produced were produced"
              exit 1
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing component package(s) with suffix:$missing"
            exit 1
          fi

      - name: Dump the declared dependency metadata
        run: |
          set -euxo pipefail
          kind='${{ matrix.dist.kind }}'
          if [ "$kind" = pac ]; then ext='pkg.tar.zst'; else ext="$kind"; fi
          {
            echo "### Declared dependencies as shipped"
            echo
            for f in out/*."$ext"; do
              echo "#### \`$(basename "$f")\`"
              echo '```'
              if [ "$kind" = deb ]; then
                dpkg-deb -f "$f" Package Depends
              elif [ "$kind" = rpm ]; then
                rpm -qpi "$f" | grep -E '^(Name|Version|Requires)' || true
              else
                pacman -Qip "$f" | grep -E '^(Name|Version|Depends On)' || true
              fi
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.dist.name }}
          path: out
          if-no-files-found: error

  # ================================================================= stage B
  verify-runtime:
    name: "B runtime (${{ matrix.dist.name }})"
    # Both pack jobs, because the matrix carries every line. GitHub cannot
    # express "this row depends on this pack job", so the job is allowed to run
    # regardless and a row whose own pack job failed fails on its missing
    # artifact instead - which keeps one line's packaging failure from silently
    # suppressing the other lines' stages.
    needs: [pack, pack-alpine]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # Debian, "-devel" on Fedora, "-dev" again on Alpine - and there the
          # runtime package carries no Qt generation at all, so its "suffix" is
          # the whole name and only `qmdmm` matches it. Arch splits nothing: one
          # package carries the runtime, the headers and the CMake package, so
          # the same suffix answers both questions.
          #
          # `expect` is what stage A asserts the produced package names end in.
          # Where a line's shape is a decision rather than a convention it is
          # written down here instead of being left implied: Arch expects one
          # package and no doc component, because doxygen is deliberately not one
          # of its recipe's make dependencies.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
          - name: alpine
            image: 'alpine:latest'
            kind: apk
            # No `expect`: this row's pack stage is the separate `pack-alpine`
            # job, which asserts its own three exact names. No dev-common either:
            # abuild's split_dev puts the headers and the CMake package config
            # into -dev itself, so there is no third package.
            sfx_runtime: 'qmdmm'
            sfx_dev: '-dev'
    steps:
      - name: Install bash
        # The alpine image ships busybox ash and this file declares bash as its
        # shell, so bash has to arrive first - and this one step has to ask for
        # sh. The other lines start with bash already installed.
        if: matrix.dist.kind == 'apk'
        shell: sh
        run: apk add --no-cache bash

      - name: Bring the base image up to date
        run: |
          set -euxo pipefail
          # A container image is a snapshot, and a stale one muddies the question
          # this job asks: how much of what lands on the system can be attributed
          # to the package under test and its declared dependencies. Refreshing
          # the base first means everything installed afterwards is measured
          # against a current archive rather than against whatever the image
          # happened to be built from.
          #
          # apt-get dist-upgrade rather than upgrade: the transaction has to stay
          # free to add and remove packages, which is what a distribution expects
          # of a system it is about to install new software onto.
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf -y --setopt=install_weak_deps=False upgrade
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # Arch has one rolling repository set, so -Syu is the whole "bring it
            # up to date" story - there is no sid/stable split to choose between.
            # The keyring goes first because an image that has aged cannot verify
            # today's packages, and the mirrorlist is pinned to the canonical geo
            # mirror so the job does not depend on which entries the image
            # happens to ship enabled.
            echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
              > /etc/pacman.d/mirrorlist
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Syu --noconfirm
          else
            # `--available` is apk's dist-upgrade: every package may move to what
            # the repositories have now.
            apk update
            apk upgrade --available
          fi

      - name: Install the inspection tooling
        run: |
          set -euxo pipefail
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              binutils dpkg-dev apt-utils
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf install -y --setopt=install_weak_deps=False binutils createrepo_c
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # binutils is the whole list here: ldd is the assertion and strings is
            # the QML check, and repo-add - Arch's counterpart of
            # dpkg-scanpackages and createrepo_c - ships with pacman itself.
            pacman -S --noconfirm --needed binutils
          else
            # ldd comes from musl-utils here - same criterion as on the glibc
            # lines, a different implementation of it - and the QML assertion
            # further down reads a binary with `strings` from binutils. git and
            # ca-certificates are for the checkout step below (that action shells
            # out to git); both are installed before the install snapshot, so
            # neither can be mistaken for something the package dragged in.
            apk add --no-cache binutils musl-utils git ca-certificates
          fi
          command -v ldd

      - name: Checkout this harness
        # Only the apk line installs from a repository it has to trust, and the
        # public half of the packager key lives in this repository - see the
        # publish step below.
        if: matrix.dist.kind == 'apk'
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      - name: Publish the packages as a local repository
        run: |
          set -euxo pipefail
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            cd pkgs
            dpkg-scanpackages -m . > Packages
            apt-ftparchive release . > Release
            echo "deb [trusted=yes] file://$PWD ./" > /etc/apt/sources.list.d/qmdmm-local.list
            cd ..
            apt-get update
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            createrepo_c pkgs
            printf '[qmdmm-local]\nname=QMdmm local\nbaseurl=file://%s/pkgs\nenabled=1\ngpgcheck=0\n' \
              "$PWD" > /etc/yum.repos.d/qmdmm-local.repo
            cat /etc/yum.repos.d/qmdmm-local.repo
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # Arch's repository is built by repo-add, which ships with pacman. The
            # line does not sign its package, so this section carries it as
            # optional-and-trusted instead of requiring a signature - a decision
            # confined to this one local repository, never to the system's own
            # repositories.
            repo-add pkgs/qmdmm-local.db.tar.gz pkgs/*.pkg.tar.zst
            printf '\n[qmdmm-local]\nSigLevel = Optional TrustAll\nServer = file://%s/pkgs\n' \
              "$PWD" >> /etc/pacman.conf
            tail -4 /etc/pacman.conf
            pacman -Syu --noconfirm
          else
            # The one place this line asks for something the other lines do not:
            # neither apt nor dnf refuses an unsigned local repository, so those
            # lines write trusted=yes / gpgcheck=0 and never meet the question.
            # apk does refuse one, and abuild offers no way to switch signing
            # off, so the key that signed the index has to be in place first.
            install -m 644 "packaging/alpine/$PACKAGER_KEY.rsa.pub" /etc/apk/keys/
            # The repository is the *parent* of the arch directory: apk appends
            # <arch>/APKINDEX.tar.gz itself.
            echo "file://$PWD/pkgs" >> /etc/apk/repositories
            cat /etc/apk/repositories
            apk update
          fi

      - name: Install the runtime package and repair the dependency set (deb)
        if: matrix.dist.kind == 'deb'
        run: |
          set -euxo pipefail
          runtime=$(awk -F'\t' -v s='${{ matrix.dist.sfx_runtime }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "runtime package: $runtime"
          apt-get install -y "$runtime"
          echo '::group::apt-get -f install (repair pass)'
          apt-get -f install -y 2>&1 | tee /tmp/repair.log
          echo '::endgroup::'
          apt-get check
          {
            echo '### Runtime install: what the repair pass had to add'
            echo
            echo '```'
            grep -E '^(Inst|Conf|Remv|Removing|The following)' /tmp/repair.log \
              || echo '(nothing: the declared dependencies were complete)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the runtime package and repair the dependency set (rpm)
        if: matrix.dist.kind == 'rpm'
        run: |
          set -euxo pipefail
          runtime=$(awk -F'\t' -v s='${{ matrix.dist.sfx_runtime }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "runtime package: $runtime"
          # dnf resolves the whole transaction or fails, so the "repair" pass
          # here is a second, idempotent install plus a dependency audit.
          dnf install -y "$runtime"
          dnf install -y "$runtime"
          if dnf check --dependencies > /tmp/dnfcheck.log 2>&1; then
            echo 'dnf check: clean'
          else
            cat /tmp/dnfcheck.log
            if grep -qE 'qmdmm|libQt6|qt6-' /tmp/dnfcheck.log; then
              echo '::error::dnf reports unsatisfied dependencies for a QMdmm/Qt package'
              exit 1
            fi
            echo '(dnf check reported unrelated issues; not caused by this package)'
          fi
          {
            echo '### Runtime install: dependency audit'
            echo
            echo '```'
            cat /tmp/dnfcheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the runtime package and audit the dependency set (pac)
        if: matrix.dist.kind == 'pac'
        run: |
          set -euxo pipefail
          pkg=$(awk -F'\t' -v s='${{ matrix.dist.sfx_runtime }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "package: $pkg"
          # pacman resolves a whole transaction or refuses it, like dnf, so there
          # is no half-installed state to repair and no repair pass here. What
          # carries the claim "the declared dependencies were complete" is the
          # database audit: it reports dependencies that are not installed for
          # every package on the system, not just the one under test.
          pacman -S --noconfirm --needed "$pkg"
          if pacman -Dk > /tmp/depcheck.log 2>&1; then
            echo 'pacman -Dk: no missing dependencies'
          else
            cat /tmp/depcheck.log
            if grep -qE 'qmdmm|qt6-' /tmp/depcheck.log; then
              echo '::error::pacman reports unsatisfied dependencies for a QMdmm/Qt package'
              exit 1
            fi
            echo '(pacman -Dk reported unrelated issues; not caused by this package)'
          fi
          {
            echo '### Package install: dependency audit'
            echo
            echo '```'
            cat /tmp/depcheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the runtime package and audit the dependency set (apk)
        if: matrix.dist.kind == 'apk'
        run: |
          set -euxo pipefail
          runtime=$(awk -F'\t' -v s='${{ matrix.dist.sfx_runtime }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "runtime package: $runtime"
          # Installing by name only succeeds if the package declares its own
          # dependencies - which is the point. apk resolves the whole transaction
          # or fails, unlike apt, which will leave a half-configured system for
          # `apt-get -f install` to repair: there is nothing to repair here. The
          # second install is idempotent and only kept so this step reads like the
          # other rows'.
          #
          # `apk list` rather than `apk info -e`: apk-tools 3 moved that question
          # to `apk list`, and `alpine:latest` can move under this workflow. A file
          # rather than a pipe into grep, because with pipefail a grep that exits
          # early can turn a found match into a SIGPIPE failure.
          apk list --installed | sort > /tmp/before.txt
          apk add "$runtime"
          apk add "$runtime"
          apk list --installed | sort > /tmp/after.txt
          grep -qE "^${runtime}-[0-9]" /tmp/after.txt \
            || { echo "::error::$runtime is not installed"; exit 1; }
          {
            echo '### Runtime install: what installing it added'
            echo
            echo '```'
            comm -13 /tmp/before.txt /tmp/after.txt
            echo '```'
            echo
            echo "added: $(comm -13 /tmp/before.txt /tmp/after.txt | wc -l) packages"
            echo "installed in total: $(wc -l < /tmp/after.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that every installed QMdmm binary and library resolves
        run: |
          # GitHub runs the step body with -e, and every assertion below is about
          # a non-zero exit status, so errexit is turned off explicitly.
          set +e
          set -uo pipefail
          targets=$(ls /usr/bin/QMdmm6 /usr/bin/QMdmmBot6 /usr/bin/QMdmmServer6)
          targets="$targets $(ls /usr/lib/*/libQMdmmCore6.so.* /usr/lib/*/libQMdmmNetworking6.so.* 2>/dev/null || true)"
          targets="$targets $(ls /usr/lib/libQMdmmCore6.so.* /usr/lib/libQMdmmNetworking6.so.* 2>/dev/null || true)"
          failed=0
          for t in $targets; do
            echo "### ldd $t"
            ldd "$t" | tee /tmp/ldd.log
            if grep -q 'not found' /tmp/ldd.log; then
              echo "::error::$t has unresolved shared libraries"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Run the installed programs
        run: |
          # GitHub runs the step body with -e, and every assertion below is about
          # a non-zero exit status, so errexit is turned off explicitly.
          set +e
          set -uo pipefail
          export QT_QPA_PLATFORM=offscreen
          failed=0

          # What "still running when the timeout fired" looks like. busybox
          # timeout - the one on Alpine - reports 143 (128 + SIGTERM) for a child
          # it had to kill, where GNU coreutils reports 124. The accepted set
          # follows each line's own timeout instead of taking both everywhere: on
          # the glibc lines a 143 would mean something *else* killed the program,
          # which is exactly what this check exists to catch.
          timeout_rcs='0 124'
          if [ '${{ matrix.dist.kind }}' = apk ]; then timeout_rcs='0 124 143'; fi
          survived() {
            local r
            for r in $timeout_rcs; do
              [ "$1" = "$r" ] && return 0
            done
            return 1
          }
          # The loader's own words for a failure, and musl phrases it differently
          # from glibc: a missing library is "version X not found" there, and a
          # crash is Segmentation/Aborted rather than a shared-library error.
          fatal() {
            local re='error while loading shared libraries|undefined symbol|symbol lookup error'
            if [ '${{ matrix.dist.kind }}' = apk ]; then
              re='error while loading|version .* not found|undefined symbol|symbol lookup error|Segmentation|Aborted'
            fi
            grep -qiE "$re" "$1"
          }

          # Seeing the connection the server accepted is what turns "the bot is
          # running" into "the bot really reached the server". That is read out of
          # the kernel's socket tables, where QMdmm's default TCP port 6366 spells
          # 18DE and 0A/01 mean LISTEN/ESTABLISHED. If a container ever hides
          # those files, warn and fall back to liveness: a blind harness must not
          # fail an otherwise sound package, and the warning says the check was
          # skipped.
          port_hex=18DE
          net_files=''
          for f in /proc/net/tcp /proc/net/tcp6; do
            if [ -r "$f" ]; then net_files="$net_files $f"; fi
          done
          net_visible=0
          [ -n "$net_files" ] && net_visible=1
          # Both tables, deliberately: the server listens on QHostAddress::Any,
          # which Qt maps to the dual-stack IPv6 wildcard, so its socket lives in
          # tcp6 - and the address width differs between the two files, hence the
          # unanchored [0-9A-F]+. $net_files is meant to word-split.
          is_listening() { grep -qE ":${port_hex} +[0-9A-F]+:[0-9A-F]{4} +0A" $net_files; }
          is_connected() { grep -qE ":${port_hex} +[0-9A-F]+:[0-9A-F]{4} +01" $net_files; }
          if [ "$net_visible" -eq 0 ]; then
            echo "::warning::neither /proc/net/tcp nor /proc/net/tcp6 is readable here; the connection checks are skipped"
          fi

          {
            echo '### Programs started from the installed runtime package'
            echo
            echo 'rc 124 (GNU timeout) and rc 143 (busybox timeout) both mean the'
            echo 'program was still running when the timeout hit, which is what a'
            echo 'GUI, a server and a bot are supposed to do.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # The GUI is the only program that runs on its own.
          timeout 20 /usr/bin/QMdmm6 >/tmp/gui.out 2>/tmp/gui.err
          rc=$?
          echo "### /usr/bin/QMdmm6 rc=$rc"
          sed -e 's/^/  err| /' /tmp/gui.err
          if ! survived "$rc"; then
            echo "::error::QMdmm6 exited with rc=$rc"
            failed=1
          fi
          if fatal /tmp/gui.err; then
            echo "::error::QMdmm6 reported a fatal loading or crash message"
            failed=1
          fi
          # Staying alive is not the whole story for a GUI: with the QML resource
          # prefix wrong it does exactly that and still shows an empty window,
          # complaining only that its own qrc path is missing. Same assertion as
          # the rebuilt GUI in stage C - the packaged GUI has to resolve its QML
          # out of its own resources, not out of the build tree.
          if grep -q 'No such file or directory' /tmp/gui.err; then
            echo "::error::the installed GUI could not resolve its QML out of its own resources"
            failed=1
          fi
          # That warning is only a negative, and on Fedora gui.err is empty
          # either way, so also ask the binary itself. The path below is both
          # what QMdmmGui/src/mainwindow.cpp asks the resource system for and
          # where the QTP0001 policy puts a QML module's resources, so the two
          # agreeing is exactly what has to hold. Qt keeps these strings as
          # UTF-16 - an ASCII grep finds nothing at all - hence `strings -e l`,
          # and `-a` so the whole file is read rather than the data sections.
          # Deliberately not main.qml: mainwindow.cpp spells that path out in a
          # literal of its own, so it is compiled in whether the prefix is right
          # or not. A name only the compiled QML table carries moves with the
          # prefix; this was measured against a build with the prefix forced
          # wrong (it drops from one occurrence to none).
          strings -a -e l /usr/bin/QMdmm6 >/tmp/gui.strings
          if ! grep -q '/qt/qml/QMdmm/Gui/qml/GameScene.qml' /tmp/gui.strings; then
            echo "::error::the installed GUI does not carry its QML at qrc:/qt/qml/QMdmm/Gui/qml"
            failed=1
          fi

          # The server calls qFatal() when it cannot listen, which aborts with a
          # non-zero status, so staying alive is what "it runs" means here.
          /usr/bin/QMdmmServer6 >/tmp/server.out 2>/tmp/server.err &
          server_pid=$!
          for _ in $(seq 1 40); do
            kill -0 "$server_pid" 2>/dev/null || break
            if [ "$net_visible" -eq 1 ] && is_listening; then break; fi
            sleep 0.25
          done
          if kill -0 "$server_pid" 2>/dev/null; then
            echo "### /usr/bin/QMdmmServer6 is running"
            if [ "$net_visible" -eq 1 ] && ! is_listening; then
              echo "::error::QMdmmServer6 is up but nothing is listening on TCP 6366"
              failed=1
            fi
          else
            wait "$server_pid"
            rc=$?
            sed -e 's/^/  err| /' /tmp/server.err
            echo "::error::QMdmmServer6 exited with rc=$rc"
            failed=1
          fi

          # The bot refuses to start at all without --host (it exits 3 instead of
          # running) and, with one, it stays in its event loop forever: an exit
          # status alone cannot tell "connected" from "dialling a host that never
          # answers", because the client simply retries. The proof is the
          # accepted connection on the server side, which only exists once the
          # packaged client really got through over the packaged stack.
          /usr/bin/QMdmmBot6 --host=qmdmm://localhost:6366 >/tmp/bot.out 2>/tmp/bot.err &
          bot_pid=$!
          bot_connected=0
          for _ in $(seq 1 60); do
            kill -0 "$bot_pid" 2>/dev/null || break
            if is_connected; then bot_connected=1; break; fi
            sleep 0.25
          done
          if kill -0 "$bot_pid" 2>/dev/null; then
            echo "### /usr/bin/QMdmmBot6 is up and in its event loop"
          else
            wait "$bot_pid"
            rc=$?
            echo "::error::QMdmmBot6 exited with rc=$rc instead of staying connected"
            failed=1
          fi
          sed -e 's/^/  err| /' /tmp/bot.err
          if [ "$bot_connected" -eq 1 ]; then
            echo "### /usr/bin/QMdmmBot6 connected to /usr/bin/QMdmmServer6 over TCP"
          elif [ "$net_visible" -eq 1 ]; then
            echo "::error::no established connection on port 6366: the bot never reached the server"
            # Leave evidence behind: which sockets the kernel does know about
            # says far more than "it did not work". 02 is SYN_SENT (nothing is
            # answering), 04/06 mean the handshake finished and the far end then
            # closed, 01 means it is up right now.
            echo "### Sockets referencing port 6366 after the failure:"
            grep -hE ":${port_hex} " $net_files || echo '(none at all)'
            failed=1
          fi
          if fatal /tmp/bot.err; then
            echo "::error::QMdmmBot6 reported a fatal loading or crash message"
            failed=1
          fi

          # The server's own log is the other side of that connection.
          server_log=$(ls -1t /var/QMdmm/log/QMdmmServer-* 2>/dev/null | head -1)
          if [ -n "$server_log" ] && [ -s "$server_log" ]; then
            {
              echo "### Server-side log (\`$server_log\`)"
              echo
              echo '```'
              tail -40 "$server_log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          kill "$bot_pid" "$server_pid" 2>/dev/null
          wait 2>/dev/null

          [ "$failed" -eq 0 ]

  # ================================================================= stage C
  verify-dev:
    name: "C dev (${{ matrix.dist.name }})"
    needs: [pack, pack-alpine]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.dist.image }}
    strategy:
      fail-fast: false
      matrix:
        dist:
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # The sfx_* fields are the package-name suffixes the later stages
          # select on. They differ per distribution because the development
          # packages follow each distribution's own convention: "-dev" on
          # Debian, "-devel" on Fedora, "-dev" again on Alpine - and there the
          # runtime package carries no Qt generation at all, so its "suffix" is
          # the whole name and only `qmdmm` matches it. Arch splits nothing: one
          # package carries the runtime, the headers and the CMake package, so
          # the same suffix answers both questions.
          #
          # `expect` is what stage A asserts the produced package names end in.
          # Where a line's shape is a decision rather than a convention it is
          # written down here instead of being left implied: Arch expects one
          # package and no doc component, because doxygen is deliberately not one
          # of its recipe's make dependencies.
          - name: debian
            image: 'debian:sid'
            kind: deb
            expect: '-6 -6-dev -common-dev -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-dev'
          - name: fedora
            image: 'fedora:latest'
            kind: rpm
            expect: '-6 -6-devel -common-devel -doc'
            sfx_runtime: '-6'
            sfx_dev: '-6-devel'
          - name: arch
            image: 'archlinux:base'
            kind: pac
            expect: '-6'
            sfx_runtime: '-6'
            sfx_dev: '-6'
          - name: alpine
            image: 'alpine:latest'
            kind: apk
            # No `expect`: this row's pack stage is the separate `pack-alpine`
            # job, which asserts its own three exact names. No dev-common either:
            # abuild's split_dev puts the headers and the CMake package config
            # into -dev itself, so there is no third package.
            sfx_runtime: 'qmdmm'
            sfx_dev: '-dev'
    steps:
      - name: Install bash
        # The alpine image ships busybox ash and this file declares bash as its
        # shell, so bash has to arrive first - and this one step has to ask for
        # sh. The other lines start with bash already installed.
        if: matrix.dist.kind == 'apk'
        shell: sh
        run: apk add --no-cache bash

      - name: Bring the base image up to date
        run: |
          set -euxo pipefail
          # A container image is a snapshot, and a stale one muddies the question
          # this job asks: how much of what lands on the system can be attributed
          # to the package under test and its declared dependencies. Refreshing
          # the base first means everything installed afterwards is measured
          # against a current archive rather than against whatever the image
          # happened to be built from.
          #
          # apt-get dist-upgrade rather than upgrade: the transaction has to stay
          # free to add and remove packages, which is what a distribution expects
          # of a system it is about to install new software onto.
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade -y
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf -y --setopt=install_weak_deps=False upgrade
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # Arch has one rolling repository set, so -Syu is the whole "bring it
            # up to date" story - there is no sid/stable split to choose between.
            # The keyring goes first because an image that has aged cannot verify
            # today's packages, and the mirrorlist is pinned to the canonical geo
            # mirror so the job does not depend on which entries the image
            # happens to ship enabled.
            echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
              > /etc/pacman.d/mirrorlist
            pacman -Sy --noconfirm --needed archlinux-keyring
            pacman -Syu --noconfirm
          else
            # `--available` is apk's dist-upgrade: every package may move to what
            # the repositories have now.
            apk update
            apk upgrade --available
          fi

      - name: Install a plain build toolchain
        run: |
          set -euxo pipefail
          # What a user already has before trying to build a GUI application: a
          # compiler, CMake and Ninja. Every Qt dependency and QMdmm itself must
          # arrive through the dev package under test. binutils comes with a
          # compiler and is named anyway, because the QML check below reads the
          # binary with `strings`.
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              git ca-certificates build-essential cmake ninja-build dpkg-dev apt-utils \
              binutils
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            dnf install -y --setopt=install_weak_deps=False \
              git ca-certificates gcc-c++ make cmake ninja-build createrepo_c \
              binutils
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # base-devel is the Arch answer to "a plain build toolchain", the
            # same role build-essential and gcc-c++ play on the other lines.
            pacman -S --noconfirm --needed \
              base-devel git ca-certificates cmake ninja binutils
          else
            # The Alpine equivalent of build-essential. g++ is a package of its
            # own here and is not part of gcc: without it CMake finds no CXX
            # compiler at all and fails at project(). pkgconf is named because
            # Qt's own CMake files want it, as pkg-config is on the Debian line.
            apk add --no-cache git ca-certificates gcc g++ musl-dev make cmake pkgconf binutils
          fi

      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.dist.name }}
          path: pkgs

      - name: Publish the packages as a local repository
        run: |
          set -euxo pipefail
          if [ '${{ matrix.dist.kind }}' = deb ]; then
            cd pkgs
            dpkg-scanpackages -m . > Packages
            apt-ftparchive release . > Release
            echo "deb [trusted=yes] file://$PWD ./" > /etc/apt/sources.list.d/qmdmm-local.list
            cd ..
            apt-get update
          elif [ '${{ matrix.dist.kind }}' = rpm ]; then
            createrepo_c pkgs
            printf '[qmdmm-local]\nname=QMdmm local\nbaseurl=file://%s/pkgs\nenabled=1\ngpgcheck=0\n' \
              "$PWD" > /etc/yum.repos.d/qmdmm-local.repo
            cat /etc/yum.repos.d/qmdmm-local.repo
          elif [ '${{ matrix.dist.kind }}' = pac ]; then
            # Arch's repository is built by repo-add, which ships with pacman. The
            # line does not sign its package, so this section carries it as
            # optional-and-trusted instead of requiring a signature - a decision
            # confined to this one local repository, never to the system's own
            # repositories.
            repo-add pkgs/qmdmm-local.db.tar.gz pkgs/*.pkg.tar.zst
            printf '\n[qmdmm-local]\nSigLevel = Optional TrustAll\nServer = file://%s/pkgs\n' \
              "$PWD" >> /etc/pacman.conf
            tail -4 /etc/pacman.conf
            pacman -Syu --noconfirm
          else
            # Same as stage B: the key has to be in place before the repository
            # is, or apk rejects the index as UNTRUSTED. See the note there.
            install -m 644 "packaging/alpine/$PACKAGER_KEY.rsa.pub" /etc/apk/keys/
            echo "file://$PWD/pkgs" >> /etc/apk/repositories
            cat /etc/apk/repositories
            apk update
          fi

      - name: Install the dev package and repair the dependency set (deb)
        if: matrix.dist.kind == 'deb'
        run: |
          set -euxo pipefail
          dev=$(awk -F'\t' -v s='${{ matrix.dist.sfx_dev }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "dev package: $dev"
          # Installing the dev package by name only succeeds if it declares its
          # own runtime, dev-common and Qt dependencies - which is the point.
          apt-get install -y "$dev"
          echo '::group::apt-get -f install (repair pass)'
          apt-get -f install -y 2>&1 | tee /tmp/repair.log
          echo '::endgroup::'
          apt-get check
          {
            echo '### Dev install: what the repair pass had to add'
            echo
            echo '```'
            grep -E '^(Inst|Conf|Remv|Removing|The following)' /tmp/repair.log \
              || echo '(nothing: the declared dependencies were complete)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the dev package and repair the dependency set (rpm)
        if: matrix.dist.kind == 'rpm'
        run: |
          set -euxo pipefail
          dev=$(awk -F'\t' -v s='${{ matrix.dist.sfx_dev }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "dev package: $dev"
          dnf install -y "$dev"
          if dnf check --dependencies > /tmp/dnfcheck.log 2>&1; then
            echo 'dnf check: clean'
          else
            cat /tmp/dnfcheck.log
            if grep -qE 'qmdmm|libQt6|qt6-' /tmp/dnfcheck.log; then
              echo '::error::dnf reports unsatisfied dependencies for a QMdmm/Qt package'
              exit 1
            fi
            echo '(dnf check reported unrelated issues; not caused by this package)'
          fi
          {
            echo '### Dev install: dependency audit'
            echo
            echo '```'
            cat /tmp/dnfcheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the dev package and audit the dependency set (pac)
        if: matrix.dist.kind == 'pac'
        run: |
          set -euxo pipefail
          # The same package the runtime stage installs: Arch splits nothing, so
          # this line's runtime package *is* its dev package. What is tested here
          # is therefore not "a second package resolves" but "one package is
          # enough to build against" - the headers and the CMake package it
          # carries have to work with nothing but what it dragged in.
          pkg=$(awk -F'\t' -v s='${{ matrix.dist.sfx_dev }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "package: $pkg"
          pacman -S --noconfirm --needed "$pkg"
          # Same audit as the runtime stage, for the same reason: pacman either
          # resolves the transaction or refuses it, so what is left to check is
          # whether anything on the system is unsatisfied.
          if pacman -Dk > /tmp/depcheck.log 2>&1; then
            echo 'pacman -Dk: no missing dependencies'
          else
            cat /tmp/depcheck.log
            if grep -qE 'qmdmm|qt6-' /tmp/depcheck.log; then
              echo '::error::pacman reports unsatisfied dependencies for a QMdmm/Qt package'
              exit 1
            fi
            echo '(pacman -Dk reported unrelated issues; not caused by this package)'
          fi
          {
            echo '### Dev install: dependency audit'
            echo
            echo '```'
            cat /tmp/depcheck.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install the dev package and audit the dependency set (apk)
        if: matrix.dist.kind == 'apk'
        run: |
          set -euxo pipefail
          dev=$(awk -F'\t' -v s='${{ matrix.dist.sfx_dev }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          runtime=$(awk -F'\t' -v s='${{ matrix.dist.sfx_runtime }}' '$1 ~ s"$" { print $1 }' pkgs/MANIFEST.tsv)
          echo "dev package: $dev"
          # Installing the dev package by name only succeeds if it declares its
          # own runtime, documentation and Qt dependencies - which is the point.
          # On this line that declaration is `depends_dev` in the APKBUILD:
          # abuild's default split gives -dev the runtime package and the so:
          # closure of its symlinks, which is nothing to compile against.
          apk list --installed | sort > /tmp/before.txt
          apk add "$dev"
          apk list --installed | sort > /tmp/after.txt
          grep -qE "^${dev}-[0-9]" /tmp/after.txt \
            || { echo "::error::$dev is not installed"; exit 1; }
          # The runtime package has to arrive with it, not have been installed by
          # hand above.
          grep -qE "^${runtime}-[0-9]" /tmp/after.txt \
            || { echo "::error::$runtime did not come with the dev package"; exit 1; }

      - name: Report what the dev package dragged in
        run: |
          set -euxo pipefail
          {
            echo '### Everything present after installing only the dev package'
            echo
            echo '```'
            if [ '${{ matrix.dist.kind }}' = deb ]; then
              dpkg-query -W -f='${Package}\t${Version}\n' | sort
            elif [ '${{ matrix.dist.kind }}' = rpm ]; then
              rpm -qa --qf '%{NAME}\t%{VERSION}\n' | sort
            elif [ '${{ matrix.dist.kind }}' = pac ]; then
              pacman -Q | sort
            else
              # The difference the dev package made to the package set: apk
              # resolves the whole transaction or fails, so the repair pass the
              # Debian line runs afterwards has no counterpart here.
              comm -13 /tmp/before.txt /tmp/after.txt
            fi
            echo '```'
            if [ '${{ matrix.dist.kind }}' = apk ]; then
              echo
              echo "added: $(comm -13 /tmp/before.txt /tmp/after.txt | wc -l) packages"
              echo "installed in total: $(wc -l < /tmp/after.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the QMdmm sources for the GUI and Bot
        run: |
          set -euxo pipefail
          git init qmdmm-src
          git -C qmdmm-src remote add origin "$QMDMM_REPO"
          git -C qmdmm-src fetch --depth 1 origin '${{ env.QMDMM_REF }}'
          git -C qmdmm-src checkout --detach FETCH_HEAD

      - name: Build the consumer project against the installed package
        run: |
          set -euxo pipefail
          # Ninja everywhere except Alpine, whose cmake defaults to it while the
          # ninja-build package puts the binary off PATH - that line asks for Unix
          # Makefiles, which is also why its toolchain installs `make`.
          generator='Ninja'
          if [ '${{ matrix.dist.kind }}' = apk ]; then generator='Unix Makefiles'; fi
          cmake -S consumer -B consumer-build -G "$generator" \
            -DCMAKE_BUILD_TYPE='${{ env.QMDMM_BUILD_TYPE }}' \
            -DQMDMM_SOURCE_DIR="$PWD/qmdmm-src" 2>&1 | tee /tmp/consumer-configure.log
          cmake --build consumer-build --parallel

      - name: Verify the executables the consumer produced
        run: |
          # GitHub runs the step body with -e, and every assertion below is about
          # a non-zero exit status, so errexit is turned off explicitly.
          set +e
          set -uo pipefail
          failed=0
          for exe in consumer-build/qmdmm-gui/QMdmm6 \
                     consumer-build/qmdmm-bot/QMdmmBot6 \
                     consumer-build/qmdmm-server/QMdmmServer6; do
            if [ -x "$exe" ]; then
              echo "### built: $exe"
              ldd "$exe" | tee /tmp/ldd.log
              if grep -q 'not found' /tmp/ldd.log; then
                echo "::error::$exe has unresolved shared libraries"
                failed=1
              fi
            else
              echo "::error::$exe was not produced"
              failed=1
            fi
          done

          export QT_QPA_PLATFORM=offscreen

          # Same two criteria as stage B, and the same reasoning: what counts as
          # "still running" and what counts as a failure both follow the
          # distribution's own timeout and loader.
          timeout_rcs='0 124'
          if [ '${{ matrix.dist.kind }}' = apk ]; then timeout_rcs='0 124 143'; fi
          survived() {
            local r
            for r in $timeout_rcs; do
              [ "$1" = "$r" ] && return 0
            done
            return 1
          }
          fatal() {
            local re='error while loading shared libraries|undefined symbol|symbol lookup error'
            if [ '${{ matrix.dist.kind }}' = apk ]; then
              re='error while loading|version .* not found|undefined symbol|symbol lookup error|Segmentation|Aborted'
            fi
            grep -qiE "$re" "$1"
          }

          # Same connection probe as the runtime stage: 6366 reads 18DE in the
          # kernel socket tables, 0A is LISTEN and 01 is ESTABLISHED. Falls back
          # to liveness, with a warning, if those files are not readable here.
          port_hex=18DE
          net_files=''
          for f in /proc/net/tcp /proc/net/tcp6; do
            if [ -r "$f" ]; then net_files="$net_files $f"; fi
          done
          net_visible=0
          [ -n "$net_files" ] && net_visible=1
          # Both tables, deliberately: the server listens on QHostAddress::Any,
          # which Qt maps to the dual-stack IPv6 wildcard, so its socket lives in
          # tcp6 - and the address width differs between the two files, hence the
          # unanchored [0-9A-F]+. $net_files is meant to word-split.
          is_listening() { grep -qE ":${port_hex} +[0-9A-F]+:[0-9A-F]{4} +0A" $net_files; }
          is_connected() { grep -qE ":${port_hex} +[0-9A-F]+:[0-9A-F]{4} +01" $net_files; }
          if [ "$net_visible" -eq 0 ]; then
            echo "::warning::neither /proc/net/tcp nor /proc/net/tcp6 is readable here; the connection checks are skipped"
          fi

          timeout 20 consumer-build/qmdmm-gui/QMdmm6 >/tmp/gui.out 2>/tmp/gui.err
          rc=$?
          echo "### rebuilt GUI rc=$rc"
          sed -e 's/^/  err| /' /tmp/gui.err
          if ! survived "$rc"; then
            echo "::error::rebuilt GUI exited with rc=$rc"
            failed=1
          fi
          if fatal /tmp/gui.err; then
            echo "::error::the rebuilt GUI reported a fatal loading or crash message"
            failed=1
          fi
          # Linking and staying alive is not the whole story for this one: with
          # the QML resource prefix wrong it does both of those and still shows an
          # empty window, complaining only that its own qrc path is missing.
          if grep -q 'No such file or directory' /tmp/gui.err; then
            echo "::error::the rebuilt GUI could not resolve its QML out of its own resources"
            failed=1
          fi
          # Same static check as stage B, with the same reasoning. It matters
          # more here: what decides the prefix for this build is the consumer's
          # own qt6_standard_project_setup, and leaving that out is a mistake
          # this harness has made once already - the GUI then links, starts, and
          # shows an empty window.
          strings -a -e l consumer-build/qmdmm-gui/QMdmm6 >/tmp/rgui.strings
          if ! grep -q '/qt/qml/QMdmm/Gui/qml/GameScene.qml' /tmp/rgui.strings; then
            echo "::error::the rebuilt GUI does not carry its QML at qrc:/qt/qml/QMdmm/Gui/qml"
            failed=1
          fi

          # The rebuilt server on its own first, while 6366 is still free; the
          # installed one below needs that port.
          timeout 10 consumer-build/qmdmm-server/QMdmmServer6 >/tmp/rserver.out 2>/tmp/rserver.err
          rc=$?
          echo "### rebuilt Server rc=$rc"
          sed -e 's/^/  err| /' /tmp/rserver.err
          if ! survived "$rc"; then
            echo "::error::rebuilt Server exited with rc=$rc"
            failed=1
          fi
          if fatal /tmp/rserver.err; then
            echo "::error::the rebuilt Server reported a fatal loading or crash message"
            failed=1
          fi

          # The rebuilt bot is pointed at the *installed* server, which the dev
          # package dragged in as its runtime dependency. That closes the loop: a
          # source build against the dev package talking to the packaged runtime.
          /usr/bin/QMdmmServer6 >/tmp/server.out 2>/tmp/server.err &
          server_pid=$!
          for _ in $(seq 1 40); do
            kill -0 "$server_pid" 2>/dev/null || break
            if [ "$net_visible" -eq 1 ] && is_listening; then break; fi
            sleep 0.25
          done
          if kill -0 "$server_pid" 2>/dev/null; then
            echo "### the installed /usr/bin/QMdmmServer6 is running"
            if [ "$net_visible" -eq 1 ] && ! is_listening; then
              echo "::error::the installed QMdmmServer6 is up but nothing is listening on TCP 6366"
              failed=1
            fi
          else
            wait "$server_pid"
            rc=$?
            sed -e 's/^/  err| /' /tmp/server.err
            echo "::error::the installed QMdmmServer6 exited with rc=$rc"
            failed=1
          fi

          # Without --host the bot exits 3; with one it stays in its event loop
          # even when nothing answers, so the accepted connection - not the exit
          # status - is what proves it really got through.
          consumer-build/qmdmm-bot/QMdmmBot6 --host=qmdmm://localhost:6366 \
            >/tmp/bot.out 2>/tmp/bot.err &
          bot_pid=$!
          bot_connected=0
          for _ in $(seq 1 60); do
            kill -0 "$bot_pid" 2>/dev/null || break
            if is_connected; then bot_connected=1; break; fi
            sleep 0.25
          done
          if kill -0 "$bot_pid" 2>/dev/null; then
            echo "### the rebuilt Bot is up and in its event loop"
          else
            wait "$bot_pid"
            rc=$?
            echo "::error::the rebuilt Bot exited with rc=$rc instead of staying connected"
            failed=1
          fi
          sed -e 's/^/  err| /' /tmp/bot.err
          if fatal /tmp/bot.err; then
            echo "::error::the rebuilt Bot reported a fatal loading or crash message"
            failed=1
          fi
          if [ "$bot_connected" -eq 1 ]; then
            echo "### the rebuilt Bot connected to the installed server over TCP"
          elif [ "$net_visible" -eq 1 ]; then
            echo "::error::no established connection on port 6366: the rebuilt Bot never reached the server"
            echo "### Sockets referencing port 6366 after the failure:"
            grep -hE ":${port_hex} " $net_files || echo '(none at all)'
            failed=1
          fi

          kill "$bot_pid" "$server_pid" 2>/dev/null
          wait 2>/dev/null

          [ "$failed" -eq 0 ]

      - name: Write the summary
        if: always()
        run: |
          {
            echo '### What the consumer project proved'
            echo
            echo '`consumer/` links nothing but the installed package:'
            echo '`find_package(QMdmm6 0.0.1 REQUIRED COMPONENTS Core Networking)`,'
            echo 'then QMdmm''s own QMdmmGui, QMdmmBot and QMdmmServer sources are'
            echo 'added with `add_subdirectory` and resolved against `QMdmm6::Core`'
            echo 'and `QMdmm6::Networking`. A green run means the dev package is'
            echo 'sufficient to rebuild all three applications. On the apk line that'
            echo 'rests on `depends_dev` in packaging/alpine/APKBUILD, since apk'
            echo 'installs nothing beyond what a package declares.'
            echo
            echo 'The rebuilt GUI is checked for a resolved QML resource, not just'
            echo 'for staying alive, and the rebuilt Bot is pointed at the installed'
            echo '`QMdmmServer6` (the dev package drags the runtime in) and has to'
            echo 'get through - so a source build against the dev package really'
            echo 'talks to the packaged runtime.'
            echo
            echo '```'
            grep -E 'QMdmm6_VERSION|QT_GENERATION|Qt6.*DIR' /tmp/consumer-configure.log | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================== stage A alpine
  # Stage A of the Alpine line is a job of its own: it shares no step with the
  # cpack job above. There is no cpack here - the package comes out of abuild and
  # packaging/alpine/APKBUILD - and the names carry no Qt-generation suffix
  # (qmdmm / qmdmm-dev / qmdmm-doc), which makes the runtime package a prefix of
  # every other name and its exact names the only useful thing to assert on. The
  # local repository is a *signed* APKINDEX as well, which is why this workflow
  # holds a packager key at all.
  #
  # Stages B and C are the matrix rows above, with the alpine branch of each
  # step: installing from a signed repository, reporting an install's delta
  # rather than a repair pass, and judging "still running" by busybox's timeout.
  #
  # The `build_type` input does not reach this stage: the recipe pins
  # CMAKE_BUILD_TYPE=Release itself. It still reaches stage C's consumer build,
  # as on the other lines.
  pack-alpine:
    name: "A pack (alpine)"
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install bash
        # The image ships busybox ash alone, and this file declares bash as its
        # shell, so bash has to arrive before anything else can run. This one step
        # therefore asks for sh explicitly.
        shell: sh
        run: apk add --no-cache bash

      - name: Bring the base image up to date
        run: |
          set -euxo pipefail
          # Same reasoning as the Debian and Fedora jobs: everything installed
          # afterwards must be measured against a current archive rather than
          # against a snapshot. `--available` is apk's dist-upgrade - every
          # package may move to what the repositories have now.
          apk update
          apk upgrade --available

      - name: Install the packager
        run: |
          set -euxo pipefail
          # Deliberately the packager only. The local (proot) verification had to
          # pre-install the whole toolchain and call abuild with -d, because proot
          # does not emulate the setuid on abuild-sudo; a container is a real root
          # environment where that helper works, so `abuild -r` resolves
          # makedepends by itself. Pre-installing that closure here would quietly
          # delete the most valuable thing this stage verifies.
          apk add --no-cache abuild fakeroot scanelf git ca-certificates openssl tar
          # abuild refuses to run as root, and the abuild package already created
          # the group its setuid helper authorizes through (gid 300): the group is
          # not created here and its gid is not pinned.
          adduser -D -G abuild builder
          id builder

      - name: Checkout this harness
        uses: actions/checkout@v7

      - name: Install the packager key
        env:
          PRIVKEY: ${{ secrets.PACKAGER_PRIVKEY }}
        run: |
          set -euxo pipefail
          if [ -z "$PRIVKEY" ]; then
            echo "::error::the PACKAGER_PRIVKEY secret is not set, and abuild cannot sign a package without a key"
            exit 1
          fi
          priv="/home/builder/.abuild/$PACKAGER_KEY.rsa"
          pub="packaging/alpine/$PACKAGER_KEY.rsa.pub"
          install -d -m 700 -o builder -g abuild /home/builder/.abuild
          printf '%s\n' "$PRIVKEY" > "$priv"
          chown builder:abuild "$priv"
          chmod 600 "$priv"
          # abuild-sign is handed the private key and takes two things from the
          # public half: it has to be next to it as <private>.pub, and the
          # signature member it writes is named after that file (".SIGN.RSA.
          # <name>"). apk resolves the same name in /etc/apk/keys, so the halves
          # have to be a pair *and* the two file names have to agree - a mismatch
          # would otherwise only surface two stages later as a bare "UNTRUSTED
          # signature". Assert both here, and put the committed public half where
          # abuild-sign looks for it.
          openssl pkey -in "$priv" -pubout -outform DER \
            | cmp - <(openssl pkey -pubin -in "$pub" -outform DER)
          install -m 644 -o builder -g abuild "$pub" "$priv.pub"
          # The building container needs it in its trust store as well, and not
          # only the consuming ones: `abuild -r` finishes by updating the
          # repository index, and `apk index` verifies the signature of every
          # package it indexes. Without the key here that last step fails once per
          # package with "UNTRUSTED signature" - after the whole build, which is
          # an expensive way to learn that the key was not where apk looks.
          install -m 644 "$pub" /etc/apk/keys/
          # And ask abuild itself. This is the very first thing `abuild -r` does
          # ("check early if we have abuild key"), so finding out here costs
          # seconds instead of the whole build.
          su builder -c "HOME=/home/builder PACKAGER_PRIVKEY=$priv abuild-sign --installed"
          echo "the secret and $pub are the same pair, abuild-sign can use them, and apk trusts the key"

      - name: Prepare the recipe and the source tarball
        run: |
          set -euxo pipefail
          install -d -m 755 -o builder -g abuild /home/builder/qmdmm
          install -m 644 -o builder -g abuild packaging/alpine/APKBUILD /home/builder/qmdmm/APKBUILD
          # A git tree rather than a codeload download: `git archive` is what
          # produces the layout abuild looks for, and the prefix has to be
          # $pkgname-$pkgver or abuild will not find the directory it expects to
          # unpack into. The clone is kept out of the recipe directory on purpose,
          # because abuild unpacks into a `src` subdirectory of that one.
          git init /home/builder/source
          git -C /home/builder/source remote add origin "$QMDMM_REPO"
          git -C /home/builder/source fetch --depth 1 origin "$QMDMM_REF"
          git -C /home/builder/source checkout --detach FETCH_HEAD
          echo "QMdmm HEAD: $(git -C /home/builder/source log --oneline -1)"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/alpine/APKBUILD)
          git -C /home/builder/source archive --format=tar.gz \
            --prefix="qmdmm-$pkgver/" \
            -o "/home/builder/qmdmm/qmdmm-$pkgver.tar.gz" FETCH_HEAD
          chown -R builder:abuild /home/builder/qmdmm
          ls -l /home/builder/qmdmm

      - name: Re-derive the source pin, then build and sign the packages
        run: |
          set -euxo pipefail
          before=$(sed -n '/^sha512sums=/{n;p;}' /home/builder/qmdmm/APKBUILD)
          su builder -c "cd /home/builder/qmdmm && HOME=/home/builder abuild checksum"
          after=$(sed -n '/^sha512sums=/{n;p;}' /home/builder/qmdmm/APKBUILD)
          {
            echo '### The source pin'
            echo
            echo 'The recipe carries a sha512 pin for the tarball that was verified'
            echo 'locally, and this run packages whatever `QMDMM_REF` points at, so'
            echo 'the tarball is generated here and the pin is re-derived from it.'
            echo 'The pin still does its job: a tarball that is not the one just'
            echo 'generated does not match it.'
            echo
            echo '```'
            echo "committed: $before"
            echo "this run:  $after"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # No -d. It means "do not resolve dependencies" and would short-circuit
          # exactly what this stage exists to check; it was only ever needed
          # because proot cannot run the setuid helper.
          su builder -c "cd /home/builder/qmdmm && HOME=/home/builder PACKAGER_PRIVKEY=/home/builder/.abuild/$PACKAGER_KEY.rsa abuild -r"

      - name: Collect the packages and record their real names
        run: |
          set -euxo pipefail
          # Where abuild put them is discovered rather than assumed: the directory
          # is named after the repository the image is pointed at, which is not
          # something to guess at from here.
          index=$(find /home/builder -name APKINDEX.tar.gz -print -quit)
          if [ -z "$index" ]; then
            echo "::error::abuild produced no APKINDEX.tar.gz"
            exit 1
          fi
          repodir=$(dirname "$index")
          echo "repository directory: $repodir"
          mkdir -p out
          cp -a "$repodir" out/

          printf 'package\tversion\tfile\n' > out/MANIFEST.tsv
          for f in out/*/*.apk; do
            p=$(tar xzOf "$f" .PKGINFO | sed -n 's/^pkgname = //p')
            v=$(tar xzOf "$f" .PKGINFO | sed -n 's/^pkgver = //p')
            printf '%s\t%s\t%s\n' "$p" "$v" "$(basename "$f")" >> out/MANIFEST.tsv
          done

          {
            echo '### Packages produced by `abuild -r`'
            echo
            echo '```'
            cat out/MANIFEST.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Exact names, not suffixes: on Alpine the runtime package is plain
          # `qmdmm`, with no Qt generation in it, which makes `qmdmm` a prefix of
          # every other name and a suffix match useless.
          missing=''
          for want in qmdmm qmdmm-dev qmdmm-doc; do
            awk -F'\t' -v n="$want" '$1 == n { found = 1 } END { exit !found }' \
              out/MANIFEST.tsv || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing package(s):$missing"
            exit 1
          fi

          # Every package and the index have to be signed by the key committed in
          # packaging/alpine: that name is what apk looks up in /etc/apk/keys, so a
          # repository signed by anything else is untrusted by construction.
          expected=".SIGN.RSA.$PACKAGER_KEY.rsa.pub"
          for f in out/*/*.apk out/*/APKINDEX.tar.gz; do
            # The listing goes to a file, and only the signature members are
            # printed: the documentation package has thousands of members, and a
            # listing that big does not fit in a pipe buffer.
            tar tzf "$f" > /tmp/members.txt
            echo "### $(basename "$f"): $(wc -l < /tmp/members.txt) members, signature members:"
            grep '^\.SIGN\.' /tmp/members.txt | sed -n 's/^/  /' || true
            # Read from the file rather than piping the listing into `grep -q`:
            # `grep -q` exits on its first match, which leaves the writer holding
            # a pipe with nobody reading it - SIGPIPE, and `set -o pipefail` turns
            # that into a failed step for a package that is signed perfectly well.
            # It only shows up on the packages whose listing exceeds the pipe
            # buffer, which is why it would look like a signature problem.
            if ! grep -qxF "$expected" /tmp/members.txt; then
              echo "::error::$(basename "$f") does not carry $expected"
              exit 1
            fi
          done

      - name: Dump the declared dependency metadata
        run: |
          set -euxo pipefail
          {
            echo '### Declared metadata as shipped'
            echo
            for f in out/*/*.apk; do
              echo "#### \`$(basename "$f")\`"
              echo '```'
              tar xzOf "$f" .PKGINFO \
                | grep -E '^(pkgname|pkgver|pkgdesc|depend|provides|size|origin) = ' || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-alpine
          path: out
          if-no-files-found: error
